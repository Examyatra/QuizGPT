<!DOCTYPE html>
<!-- Gateway Checking v2.0 (2026-11-13) -->
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gateway Checking v2.0</title>
<style>
:root{--bg:#f5f6f8;--sf:#fff;--s2:#eef0f4;--ln:#e1e4ea;--tx:#161a22;--mu:#6a7282;--ac:#3d4fe0;--ok:#12805c;--bad:#c42b3a;--wn:#b26a00}
@media(prefers-color-scheme:dark){:root{--bg:#0f1218;--sf:#171b24;--s2:#1f2430;--ln:#283040;--tx:#e8ebf2;--mu:#8a93a6;--ac:#7b8cff;--ok:#4fd1a1;--bad:#ff7b87;--wn:#f0b250}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top,0) 0 40px}
.w{max-width:760px;margin:0 auto;padding:0 14px}
h1{font-size:20px;margin:16px 0 4px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;margin:10px 0}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:9px 11px;margin:3px 0}
button{background:var(--s2);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.st{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:8px;text-align:center;cursor:pointer}
.st.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.st b{display:block;font-size:20px}.st span{font-size:11.5px;color:var(--mu)}
.m{display:flex;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--ln)}
.m:first-child{border-top:0}
.d{width:10px;height:10px;border-radius:50%;background:var(--mu);flex:none}
.working .d{background:var(--ok)}.recheck .d{background:var(--wn)}.neverWorked .d{background:var(--bad)}
.busy .d{animation:pl 1s infinite}@keyframes pl{50%{opacity:.2}}
.i{flex:1;min-width:0}.n{font-weight:600;overflow-wrap:anywhere}.t{font-size:12px;color:var(--mu);overflow-wrap:anywhere}
.m button{padding:5px 9px;font-size:12.5px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;font-size:13px;max-height:300px;overflow:auto}
#note{font-size:13px;color:var(--mu)}#note.e{color:var(--bad)}
</style></head><body><div class="w">
<h1>AI Gateway · Checking <small style="font-size:12px;color:var(--mu)">v2.0</small></h1><div id="note">Token daalo aur Connect dabao.</div>
<div class="card">
  <input id="url" placeholder="Worker URL" inputmode="url">
  <input id="tk" type="password" placeholder="Admin token">
  <div class="row"><button class="p" id="go">Connect / Refresh</button></div>
</div>
<div class="stats" id="stats"></div>
<div class="card">
  <div class="row"><input id="q" placeholder="Model dhoondo…"><select id="pv"><option value="">Sab providers</option></select></div>
  <div class="row"><button class="p" id="all" disabled>Dikhe hue sab test karo</button><button id="stop" disabled>Stop</button></div>
  <div id="prog" class="t"></div>
</div>
<div class="card" id="chat" hidden>
  <div class="n" id="cm"></div>
  <textarea id="cp" rows="3">2+2 kitna hota hai? Ek line mein jawab do.</textarea>
  <div class="row"><button class="p" id="send">Bhejo</button><button id="cx">Band</button></div>
  <pre id="co" hidden></pre>
</div>
<div class="card" id="list"></div>
</div>
<script>
const $=i=>document.getElementById(i);
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch(e){return ''}};
$('url').value=ls('ey_url')||'https://examyatri-gateway.vyup2987.workers.dev';$('tk').value=ls('ey_tk');
const CATS=[['working','✅ Working'],['recheck','⚠ Re-check'],['neverWorked','❌ Fail'],['toTest','⏳ Baaki']];
let rows=[],filt='working',stop=false,busy=false,sel=null;
const note=(t,e)=>{$('note').textContent=t;$('note').className=e?'e':''};
async function api(m,p,b){
  const r=await fetch($('url').value.trim().replace(/\/+$/,'')+p,{method:m,headers:{'content-type':'application/json','x-admin-token':$('tk').value.trim()},body:b?JSON.stringify(b):undefined});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error(j.error||'HTTP '+r.status);return j;
}
const ago=t=>{if(!t)return 'kabhi nahi';const m=Math.round((Date.now()-t)/6e4);return m<60?m+' min pehle':m<1440?Math.round(m/60)+' ghante pehle':Math.round(m/1440)+' din pehle'};
function shown(){
  const q=$('q').value.trim().toLowerCase(),pv=$('pv').value;
  return rows.filter(r=>r.cat===filt&&(!pv||r.model.startsWith(pv+'|'))&&(!q||r.model.toLowerCase().includes(q)));
}
function draw(){
  $('stats').replaceChildren(...CATS.map(([c,l])=>{
    const d=document.createElement('div');d.className='st'+(c===filt?' on':'');
    d.innerHTML='<b>'+rows.filter(r=>r.cat===c).length+'</b><span>'+l+'</span>';
    d.onclick=()=>{filt=c;draw()};return d}));
  const s=shown(),box=$('list');box.replaceChildren();
  if(!s.length){box.textContent='Is list mein kuch nahi.';}
  s.slice(0,200).forEach(r=>{
    const [pid,...mm]=r.model.split('|'),d=document.createElement('div');
    d.className='m '+r.cat+(r.busy?' busy':'');
    const i=document.createElement('div');i.className='i';
    const n=document.createElement('div');n.className='n';n.textContent=mm.join('|');
    const t=document.createElement('div');t.className='t';
    t.textContent=pid+(r.lat?' · '+(r.lat/1000).toFixed(1)+'s':'')+' · '+ago(r.tested)+(r.err?' · '+r.err:'');
    i.append(n,t);
    const b1=document.createElement('button');b1.textContent='Test';b1.disabled=busy;b1.onclick=()=>run([r.model]);
    const b2=document.createElement('button');b2.textContent='Chat';b2.onclick=()=>openChat(r.model);
    d.append(document.createElement('span'),i,b1,b2);d.firstChild.className='d';box.append(d);
  });
  if(s.length>200){const x=document.createElement('div');x.className='t';x.textContent='Pehle 200 dikh rahe hain ('+s.length+' mein se). Search/provider se chhota karo.';box.append(x)}
  $('all').disabled=busy||!s.length;$('stop').disabled=!busy;
}
async function load(){
  note('Load ho raha hai…');
  try{
    const j=await api('GET','/admin/status');
    rows=[];for(const c in j.lists)for(const x of j.lists[c])rows.push({...x,cat:c});
    const sel=$('pv'),v=sel.value;sel.length=1;
    j.providers.forEach(p=>sel.add(new Option(p.id,p.id)));sel.value=v;
    ls('ey_url',$('url').value.trim());ls('ey_tk',$('tk').value.trim());
    note('Connected · '+j.providers.length+' providers, '+rows.length+' models');draw();
  }catch(e){note(e.message==='Unauthorized'?'Token galat hai':e.message,1)}
}
async function run(keys){
  if(busy)return;busy=true;stop=false;
  for(let i=0;i<keys.length&&!stop;i+=12){
    const part=keys.slice(i,i+12);
    rows.forEach(r=>{if(part.includes(r.model))r.busy=true});draw();
    $('prog').textContent='Test chal raha hai: '+Math.min(i+12,keys.length)+' / '+keys.length;
    try{
      const j=await api('POST','/admin/test',{models:part});
      for(const k in j.results){const r=rows.find(x=>x.model===k),v=j.results[k];
        if(r)Object.assign(r,v);else rows.push({model:k,...v})}
    }catch(e){note(e.message,1);stop=true}
    rows.forEach(r=>{r.busy=false});draw();
  }
  busy=false;$('prog').textContent=stop?'Roka gaya':'Test poora hua';draw();
}
function openChat(k){sel=k;$('chat').hidden=false;$('cm').textContent=k;$('co').hidden=true;$('chat').scrollIntoView({behavior:'smooth'})}
$('send').onclick=async()=>{
  const [p,...m]=sel.split('|'),o=$('co');o.hidden=false;o.textContent='Wait…';$('send').disabled=true;
  try{const j=await api('POST','/admin/chat',{provider:p,model:m.join('|'),prompt:$('cp').value});
    o.textContent=j.ok?'('+(j.ms/1000).toFixed(1)+'s)\n\n'+(j.text||'[khaali reply]'):'Error ('+(j.ms/1000).toFixed(1)+'s): '+j.error}
  catch(e){o.textContent=e.message}
  $('send').disabled=false;
};
$('cx').onclick=()=>{$('chat').hidden=true};
$('go').onclick=load;$('q').oninput=draw;$('pv').onchange=draw;
$('all').onclick=()=>run(shown().map(r=>r.model));
$('stop').onclick=()=>{stop=true};
if($('tk').value)load();
</script></body></html>
