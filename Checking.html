<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Model Check</title>
<style>
:root{
  --bg:#f5f6f8;--surface:#fff;--surface2:#eef0f4;--line:#e1e4ea;--tx:#161a22;--mut:#6a7282;
  --acc:#3d4fe0;--acc-tx:#fff;--ok:#12805c;--ok-bg:#e3f5ee;--bad:#c42b3a;--bad-bg:#fdebed;--warn:#b26a00;
  --shadow:0 1px 2px rgba(20,26,40,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1218;--surface:#171b24;--surface2:#1f2430;--line:#283040;--tx:#e8ebf2;--mut:#8a93a6;
  --acc:#7b8cff;--acc-tx:#0d1020;--ok:#4fd1a1;--ok-bg:#12302a;--bad:#ff7b87;--bad-bg:#35181d;--warn:#f0b250;--shadow:none;
}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top,0px) 0 0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 190px}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0 14px}
h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
.iconbtn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;box-shadow:var(--shadow)}
.iconbtn:hover{background:var(--surface2)}
.iconbtn:disabled{opacity:.55;cursor:default}

/* connection panel */
.conn{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.conn[hidden]{display:none}
.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:6px}
.conn input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.conn .actions{display:flex;align-items:center;gap:12px;margin-top:10px}
.status{font-size:13px;color:var(--mut)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:16px}
.stat{padding:12px 14px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat b{display:block;font-size:22px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--mut)}
.stat.ok b{color:var(--ok)}.stat.bad b{color:var(--bad)}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 12px;color:var(--mut);font-weight:600;font-size:14.5px;white-space:nowrap}
.tab:hover{color:var(--tx)}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.tab i{font-style:normal;font-weight:600;font-size:12px;background:var(--surface2);color:var(--mut);border-radius:20px;padding:1px 8px;margin-left:6px}
.tab.on i{background:var(--acc);color:var(--acc-tx)}

/* company header + models */
.cohead{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px}
.cohead h2{margin:0;font-size:17px}
.cohead span{font-size:13px;color:var(--mut)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.m{padding:12px 14px;border-top:1px solid var(--line)}
.m:first-child{border-top:0}
.top{display:flex;align-items:center;gap:12px}
.dot{flex:0 0 auto;width:10px;height:10px;border-radius:50%;background:var(--mut);opacity:.45}
.m[data-s=ok] .dot{background:var(--ok);opacity:1}
.m[data-s=bad] .dot{background:var(--bad);opacity:1}
.m[data-s=skip] .dot{background:none;border:2px solid var(--warn);opacity:1}
.m[data-s=load] .dot{background:var(--warn);opacity:1;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.m[data-s=load] .dot{animation:none}}
.info{flex:1;min-width:0}
.name{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--mut)}
.ctl{display:flex;align-items:center;gap:8px}
.ctl select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px}
.send{background:var(--acc);color:var(--acc-tx);border:0;border-radius:9px;padding:7px 14px;font-weight:600;font-size:13.5px}
.send:disabled{opacity:.5;cursor:default}
.out{margin:10px 0 0 22px;border-radius:10px;border:1px solid var(--line);background:var(--bg);overflow:hidden}
.out[hidden]{display:none}
.oh{display:flex;justify-content:space-between;gap:8px;padding:6px 12px;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--line)}
.out.ok .oh{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.out.bad .oh{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.out.load .oh{color:var(--warn)}
.ob{padding:10px 12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:320px;overflow:auto}
.empty{padding:36px 16px;text-align:center;color:var(--mut)}

/* composer */
.composer{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.cin{max-width:760px;margin:0 auto}
.cin textarea{width:100%;resize:none;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;max-height:140px;font-size:15px}
.crow{display:flex;gap:8px;margin-top:8px}
.crow button{flex:1;border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px}
.crow .pri{background:var(--acc);color:var(--acc-tx);border:0}
.crow .sec{background:var(--surface2);border:1px solid var(--line)}
.crow button:disabled{opacity:.5;cursor:default}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
@media (max-width:480px){.stat{padding:10px}.stat b{font-size:19px}.out{margin-left:0}.top{flex-wrap:wrap}.ctl{margin-left:22px}}

/* v4: key chips, filters, gateway rows */
.conn input+.lbl{margin-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 2px 10px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;box-shadow:var(--shadow)}
.chip.on{border-color:var(--acc);color:var(--acc)}
.chip.bad{color:var(--bad)}
.kinfo{margin:0 2px 10px;font-size:13px;color:var(--mut)}
.kerr{margin:0 0 10px;border:1px solid var(--line);border-radius:10px;background:var(--bad-bg);color:var(--bad);padding:10px 12px;font-size:13.5px;overflow-wrap:anywhere;white-space:pre-wrap}
.filt{display:flex;gap:10px;align-items:center;margin:0 2px 10px}
.filt input[type=search]{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.filt label{font-size:13px;color:var(--mut);white-space:nowrap;display:flex;gap:6px;align-items:center}
.star{color:var(--warn);margin-left:6px;font-weight:700}
.tag{font-size:12px;font-weight:600;border-radius:20px;padding:2px 9px;background:var(--surface2);color:var(--mut);white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.bad{background:var(--bad-bg);color:var(--bad)}
.note{margin:0 2px 10px;font-size:12.5px;color:var(--warn)}
/* v5: per-company colour, key buttons, gateway cards */
.cohead{border-left:4px solid var(--c,var(--acc));padding-left:10px;gap:4px 12px;flex-wrap:wrap}
.cohead span{text-align:left}
.chip.on{border-color:var(--c,var(--acc))}
.send[data-s=ok]{background:var(--ok)}.send[data-s=bad]{background:var(--bad)}.send[data-s=load]{background:var(--warn)}
.send.kb{min-width:44px;padding:7px 10px}
.outs .out{margin-top:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:0 0 12px}
.card{text-align:left;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px}
.card.on{outline:2px solid var(--c)}
.card b{font-size:14px}.card span{font-size:12px;color:var(--mut)}
.kpills{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.kpills i{font-style:normal;font-size:11px;font-weight:600;border-radius:20px;padding:1px 7px;background:var(--ok-bg);color:var(--ok)}
.kpills i.bad{background:var(--bad-bg);color:var(--bad)}
.cob{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:8px;color:#fff;background:var(--c);vertical-align:1px}
.bar{height:4px;border-radius:4px;background:var(--surface2);margin:5px 0 3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}
.tag.warn{background:#fff3df;color:var(--warn)}
.m.paid{opacity:.55}
.gerr{font-size:12px;color:var(--bad);overflow-wrap:anywhere}
.chips.tiers .chip{padding:5px 10px;font-size:12.5px}
/* name-tier badges: HIGH / MID / LOW based on model name keywords */
.ntag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px;letter-spacing:.02em}
.ntag.h{background:#dbeafe;color:#1d4ed8}
.ntag.m{background:#fef9c3;color:#92400e}
.ntag.l{background:#f1f5f9;color:#64748b}
.ntag.f{background:#dcfce7;color:#166534}
@media(prefers-color-scheme:dark){
  .ntag.h{background:#1e3a5f;color:#93c5fd}
  .ntag.m{background:#3b2f00;color:#fcd34d}
  .ntag.l{background:#1e2330;color:#94a3b8}
  .ntag.f{background:#12301f;color:#86efac}
}
/* simplified model list */
.stats{grid-template-columns:repeat(3,minmax(0,1fr))}
.conn{padding:16px}
header{padding:18px 0 14px}
.sub{line-height:1.4}
.model-state-filters{margin-top:2px}
@media(max-width:480px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat{padding:10px 8px}.stat span{font-size:11.5px}}
.qcard{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;margin:0 0 12px;box-shadow:var(--shadow)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:6px}
.qrow{padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.qline{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.qtxt{overflow-wrap:anywhere}
.qmut{color:var(--mut);font-size:12.5px;overflow-wrap:anywhere}
.qbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:5px 0 2px}
.qbar i{display:block;height:100%;background:var(--ok)}
.qbar.low i{background:var(--warn)}.qbar.out i{background:var(--bad)}
.qbtn{border:1px solid var(--line);background:var(--surface);color:inherit;border-radius:8px;padding:4px 9px;font-size:12.5px;font-weight:600;flex:0 0 auto}
.qbtn:disabled{opacity:.5}
.qm{margin:4px 0 6px}.qm .qline{font-size:12.5px}
.qsum{font-size:12.5px;color:var(--mut);margin:2px 0 6px;overflow-wrap:anywhere}
.qkey{margin-top:6px;font-size:12.5px;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Model Check</h1>
      <div class="sub" id="msg">Load ho raha hai…</div>
    </div>
    <button class="iconbtn" id="gear" aria-expanded="false">⚙ Settings</button>
  </header>

  <section class="conn" id="conn" hidden>
    <label class="lbl" for="url">Gateway URL</label>
    <input id="url" placeholder="https://xxxx.web.val.run" autocomplete="off">
    <label class="lbl" for="adminToken" style="margin-top:10px">Admin token <span style="font-weight:400">(optional)</span></label>
    <input id="adminToken" type="password" placeholder="Enter admin token" autocomplete="off">
    <div class="hint">Token is used only for this session.</div>
    <div class="actions">
      <button class="iconbtn" id="load">↻ Connect</button>
      <span class="status" id="connNote"></span>
    </div>
  </section>

  <div class="stats" id="sum"></div>
  <nav class="tabs" id="tabs" aria-label="Companies"></nav>
  <div id="list"></div>
</div>

<div class="composer">
  <div class="cin">
    <div class="crow">
      <button class="pri" id="co" disabled>Test selected</button>
      <button class="sec" id="all" disabled>Test all</button>
      <button class="sec" id="smart" disabled>Smart scan</button>
    </div>
    <div class="hint">Smart scan discovers new models and rechecks a small sample of working models. Results are saved by the gateway.</div>
  </div>
</div>

<style>
.key-health-card{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--surface)}
.key-health-card .top{justify-content:space-between;flex-wrap:wrap}
.key-health-controls{margin-top:10px;flex-wrap:wrap}
.key-health-controls select{min-width:0;flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px}
.key-health-controls .send{background:var(--acc);color:var(--acc-tx);border:0;border-radius:9px;padding:8px 12px;font-weight:600}
</style>
<script>
const DEFAULT_URL = 'https://vishalyadav--ac9af586d5c311f1ac7a1607ee4eb77e.web.val.run';
const $ = (id) => document.getElementById(id);

/* ---------- model name tier helpers (mirrors score() logic in main.ts) ---------- */
function nameScore(id) {
  const s = id.toLowerCase();
  let tier = 10;
  if (/opus|ultra|max|\bpro\b|large|heavy|maverick|\br1\b|\bo[1-4]\b|\b4o\b|405b|\b[7-9]\db\b|\b[1-9]\d{2,}b\b|\d{3,}b/.test(s)) tier = 30;
  else if (/sonnet|medium|plus|turbo|flash|scout|balanced/.test(s)) tier = 20;
  if (/\bmini|\bnano|\blite|\btiny|\bmicro|\bsmall|\bhaiku|\bbase|\bedge|\bexpress|\b[1-9]b\b|\b1\db\b/.test(s)) tier = 6;
  return tier;
}
function nameTierLabel(id) {
  const t = nameScore(id);
  if (t >= 30) return { cls: 'h', txt: 'HIGH' };
  if (t >= 20) return { cls: 'm', txt: 'MID' };
  if (t <= 6)  return { cls: 'l', txt: 'LOW' };
  return null; // tier=10 = no keyword found, no badge
}
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

let provs = [];          // /admin/models : company -> keys -> models each key can see
let board = [];          // /status : gateway leaderboard (real traffic ratings)
let dbOn = null;
let gwCo = '', gwTier = '', keyState = {}, bidx = {};   // gateway tab filters + per-company key rest state
const res = {};          // rid -> 'ok' | 'bad'
const outs = {};         // rid -> {kind, head, text, right}
const refs = {};         // rid -> {row, out}  (only for rows currently on screen)
let cur = null;          // current tab: company id or '@gw' / '@keys'
const curKey = {};       // company id -> chosen key index
let q = '', starOnly = false, ntFilter = '', modelView = 'working', busy = false, stopReq = false, shown = [];

try { $('url').value = localStorage.getItem('ey_test_url') || DEFAULT_URL; }
catch (e) { $('url').value = DEFAULT_URL; }
const cacheBoard = () => { try { localStorage.setItem('ey_board_cache', JSON.stringify(board.map((b) => ({ id: b.id, provider: b.provider, model: b.model, ok: b.ok, fail: b.fail, tier: b.tier, updated: b.updated, nextCheck: b.nextCheck, rating: b.rating, avgSec: b.avgSec })))); } catch (e) {} };
const base = () => $('url').value.trim().replace(/\/+$/, '');
const authHeaders = (extra = {}) => {
  const h = { ...extra };
  const token = $('adminToken')?.value?.trim();
  if (token) h['x-admin-token'] = token;
  return h;
};
const rid = (p, k, m) => p.id + ':' + m + '|' + (k.n - 1);

/* ---------- data helpers ---------- */
function modelsFor(p, k) {
  const set = new Set(k.ok ? k.chat : []);
  p.forced.forEach((m) => set.add(m));
  const all = [...set];
  const pool = p.pool.filter((m) => set.has(m));
  const rest = all.filter((m) => !p.pool.includes(m)).sort();
  return [...pool, ...rest];
}
const isStar = (p, m) => p.pool.includes(m);
function unionCount(p) { const s = new Set(); p.keys.forEach((k) => modelsFor(p, k).forEach((m) => s.add(m))); return s.size; }

function summary() {
  const counts = { working: 0, retest: 0, never: 0, untested: 0, unavailable: 0 };
  const seen = new Set();
  provs.forEach((p) => [...new Set([...(p.ranked || []), ...(p.forced || []), ...p.keys.flatMap((k) => modelsFor(p, k))])].forEach((m) => {
    const id = p.id + ':' + m; if (seen.has(id)) return; seen.add(id);
    const bucket = modelBucket(p.id, m); counts[bucket] = (counts[bucket] || 0) + 1;
  }));
  const box = $('sum'); box.innerHTML = '';
  [['Working', counts.working, 'ok'], ['Needs recheck', counts.retest, ''], ['To test', counts.never + counts.untested, '']].forEach(([label, n, cls]) => {
    const item = el('div', 'stat ' + cls); item.appendChild(el('b', '', n)); item.appendChild(el('span', '', label)); box.appendChild(item);
  });
}

/* ---------- helpers ---------- */
const coColor = (id) => { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 360; return 'hsl(' + h + ' 62% 48%)'; };
const fmtRest = (s) => s < 90 ? s + 's' : s < 5400 ? Math.round(s / 60) + ' min' : s < 172800 ? (Math.round(s / 360) / 10) + ' ghante' : Math.round(s / 86400) + ' din';
const dbRec = (pid, m) => bidx[pid + ':' + m] || null;
const isDone = (pid, m) => { const b = dbRec(pid, m); return !!(b && b.ok + b.fail > 0); };   // already tested: result lives in Val Town SQLite
const fmtDay = (t) => t ? new Date(t).toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }) : '';
function dbState(pid, m) {
  const b = dbRec(pid, m); if (!b || !(b.ok + b.fail > 0)) return 'idle';
  if (b.tier === 'limited') return 'skip';
  if (b.tier === 'paid' || b.tier === 'dead' || b.tier === 'resting') return 'bad';
  return b.ok > 0 ? 'ok' : 'bad';
}
function modelBucket(pid, m) {
  const b = dbRec(pid, m);
  if (!b || !(b.ok + b.fail > 0)) return 'untested';
  if (b.tier === 'paid' || b.cost === 'paid') return 'unavailable';
  // A key/account/rate-limit error is inconclusive; do not label the model broken.
  const lastOk = Number(b.lastOk || b.last_ok || 0), lastFail = Number(b.lastFail || b.last_fail || 0);
  const accountIssue = /^(401|403|429|quota|account|billing|credits)/i.test(String(b.last || ''));
  if (b.ok > 0 && !accountIssue && (lastFail > lastOk || b.tier === 'slow' || b.tier === 'dead' || b.tier === 'resting')) return 'retest';
  if (b.ok > 0) return 'working';
  return 'never';
}
function modelBucketLabel(bucket) {
  return bucket === 'working' ? 'Working' : bucket === 'retest' ? 'Previously working · retest' : bucket === 'never' ? 'Never worked' : bucket === 'untested' ? 'Not tested yet' : 'Unavailable';
}
function rowState(pid, m) {
  let st = 'idle';
  for (const r0 in outs) {
    if (!r0.startsWith(pid + ':' + m + '|')) continue;
    const kd = outs[r0].kind;
    if (kd === 'load') return 'load';
    if (kd === 'ok') st = 'ok'; else if (kd === 'bad' && st !== 'ok') st = 'bad';
  }
  return st === 'idle' ? dbState(pid, m) : st;
}

/* ---------- output box under a row ---------- */
function paintOut(r0) {
  const f = refs[r0]; if (!f) return;
  const r = outs[r0];
  if (f.kb) f.kb.dataset.s = r ? r.kind : '';
  f.row.dataset.s = rowState(f.row.dataset.p, f.row.dataset.m);
  if (!r) { f.out.hidden = true; return; }
  f.out.hidden = false; f.out.className = 'out ' + r.kind; f.out.innerHTML = '';
  const h = el('div', 'oh'); h.appendChild(el('span', '', r.head)); if (r.right) h.appendChild(el('span', '', r.right));
  f.out.appendChild(h); f.out.appendChild(el('div', 'ob', r.text));
}
function setOut(r0, kind, head, text, right) { outs[r0] = { kind, head, text, right }; paintOut(r0); }

let rt = null;   // after tests the gateway ratings changed: quietly re-read /status
function softRefresh() {
  clearTimeout(rt);
  rt = setTimeout(async () => {
    try {
      const { j } = await getJson('/status');
      if (j && Array.isArray(j.leaderboard)) { board = j.leaderboard; dbOn = j.db; keyState = j.keyState || {}; cacheBoard(); if (cur === '@gw' || !busy) render(); else updateButtons(); }
    } catch (e) {}
  }, 1500);
}

/* ---------- rendering ---------- */
function render() {

/* ---------- loading ---------- */
async function getJson(path) {
  const r = await fetch(base() + path, { headers: authHeaders() });
  let j = null; try { j = await r.json(); } catch (e) {}
  return { status: r.status, j };
}
function showConn(note) { $('conn').hidden = false; $('gear').setAttribute('aria-expanded', 'true'); $('connNote').textContent = note || ''; }

async function load() {
  const u = base(); if (!u) return;
  try { localStorage.setItem('ey_test_url', u); } catch (e) {}
  $('msg').textContent = 'Connecting to gateway…'; $('load').disabled = true; $('connNote').textContent = '';
  const [rm, rs] = await Promise.allSettled([getJson('/admin/models'), getJson('/status')]);
  Object.keys(res).forEach((k) => delete res[k]); Object.keys(outs).forEach((k) => delete outs[k]);
  provs = []; board = []; dbOn = null; keyState = {};
  if (rs.status === 'fulfilled' && rs.value.j && Array.isArray(rs.value.j.leaderboard)) { board = rs.value.j.leaderboard; dbOn = rs.value.j.db; keyState = rs.value.j.keyState || {}; cacheBoard(); }

  else if (!rm.value.j || !Array.isArray(rm.value.j.providers)) err = '⚠️ Val me purana main.ts chal raha hai (/admin/models nahi mila). Latest main.ts deploy karo.';
  else provs = rm.value.j.providers;
  if (err) { $('msg').textContent = err; showConn(location.protocol === 'file:' ? 'Abhi page file:// se khula hai: hosting par upload karke kholo.' : ''); }
  else {

/* ---------- testing ---------- */
async function testOne(p, k, m, btn, auto) {
  if (btn && isDone(p.id, m) && !Object.keys(outs).some((x) => x.startsWith(p.id + ':' + m + '|')) && !confirm('Ye model pehle hi test ho chuka hai (result saved). Phir bhi test karu?')) return;
  const r0 = rid(p, k, m), msgText = 'Hi';
  setOut(r0, 'load', 'Response aa raha hai…', '');
  if (btn) btn.disabled = true;
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 50000);
  let verdict = 'transient', discoveryShared = false;   // model-level verdicts are shared; auth/quota errors stay key-scoped
  try {
    const r = await fetch(base() + '/test', { method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify({ target: p.id + ':' + m, key: k.n - 1, availableKeys: p.keys.filter(kk => modelsFor(p, kk).includes(m)).map(kk => kk.n - 1), prompt: msgText }), signal: ctl.signal });
    const j = await r.json();
    if (j.ok) { verdict = 'ok'; discoveryShared = !!j.discoveryShared; res[r0] = 'ok'; setOut(r0, 'ok', 'Working' + (j.cost === 'free' ? ' · 🆓 Free' : ''), j.text, (j.ms / 1000).toFixed(1) + 's · key ' + j.key + (j.recorded ? ' · 💾 saved' : '')); }
    else { verdict = j.cls || 'transient'; discoveryShared = !!j.discoveryShared; res[r0] = 'bad'; setOut(r0, 'bad', 'Failed' + (j.status ? ' · HTTP ' + j.status : '') + ' · key ' + (j.key || k.n) + (j.state === 'paid' ? ' · 💰 Paid' : ''), j.error || 'unknown', j.ms ? (j.ms / 1000).toFixed(1) + 's' : ''); }
  } catch (e) {
    res[r0] = 'bad';
    setOut(r0, 'bad', 'Failed', e.name === 'AbortError' ? 'Timeout: 50s me response nahi aaya.' : e.message);
  }
  clearTimeout(tm);
  if (btn) btn.disabled = false;
  // Every model-level success/definite failure is shared across compatible keys; auth/quota/transient errors stay with the selected key.
  if (discoveryShared && (verdict === 'ok' || verdict === 'model')) {
    p.keys.forEach((k2) => {
      if (k2.n === k.n || !modelsFor(p, k2).includes(m)) return;
      const r2 = rid(p, k2, m); if (outs[r2] && outs[r2].kind !== 'load') return;
      setOut(r2, verdict === 'ok' ? 'ok' : 'bad', (verdict === 'ok' ? 'Working' : 'Failed') + ' · shared model verdict from key ' + k.n, 'First discovery result is key par bhi available hai; duplicate API call nahi ki gayi.', '');
    });
  }
  summary(); softRefresh();
  if ((verdict === 'account' || verdict === 'transient') && auto && !stopReq) {   // key/account or inconclusive network result: try another eligible key once
    const k2 = p.keys.find((kk) => kk.ok && kk.n !== k.n && modelsFor(p, kk).includes(m) && !outs[rid(p, kk, m)]);
    if (k2) await testOne(p, k2, m, null, true);
  }
}

async function runAll(items) {
  if (!items.length || busy) return;
  if (items.length > 25 && !confirm(items.length + ' tests chalenge (har ek chhota request). Chalu karu?')) return;
  busy = true; stopReq = false; updateButtons();
  const queue = items.slice(); let done = 0;
  const worker = async () => { while (queue.length && !stopReq) { const it = queue.shift(); await testOne(it.p, it.k, it.m, null, true); done++; $('msg').textContent = 'Test chal raha hai… ' + done + '/' + items.length; } };
  await Promise.all([worker(), worker(), worker()]);
  const wasStopped = stopReq; busy = false; stopReq = false;
  try {
    const { j } = await getJson('/status');
    if (j && Array.isArray(j.leaderboard)) { board = j.leaderboard; dbOn = j.db; keyState = j.keyState || {}; cacheBoard(); }
  } catch (e) {}
  $('msg').textContent = wasStopped ? 'Roka gaya: ' + done + '/' + items.length + ' test hue.' : 'Discovery batch complete: ' + done + '/' + items.length + '. Results saved; failed models auto-repeat nahi honge.';
  render();
}
// Smart Test = 90% new discovery + 10% previously-working health sample.
// Ratio examples: 10 tests => 9 new + 1 old; max batch 12 => 11 new + 1 old.
// A provider:model is a single company-wide record, even when visible under multiple API keys.
// It is selected/tested once through one representative key; its model verdict is shared across all keys.
// Select up to 2 DIFFERENT models per API key, rotating across keys/providers.
// Never-worked failures and models moved to Retest by student traffic are NOT auto-retried.
const SMART_MAX = 12, SMART_PER_KEY = 2;
const FREE_NAME = /(^|[^a-z0-9])free([^a-z0-9]|$)/i, LOOKS_PAID = /(^|[^a-z0-9])(pro|ultra|max|opus|premium|plus|turbo|large)([^a-z0-9]|$)/i;
function hintOf(p, m) { let h = null; (p.keys || []).forEach((k) => { const v = k.hint && k.hint[m]; if (v === true) h = true; else if (v === false && h !== true) h = false; }); return h; }
function lane(pid, m) {
  const p = provs.find((x) => x.id === pid), h = p ? hintOf(p, m) : null, b = dbRec(pid, m);
  if ((b && b.cost === 'free') || FREE_NAME.test(m) || h === true) return 0;
  return h === false || LOOKS_PAID.test(m) ? 1.6 : 1;
}
function smartPlan() {
  const candidates = { fresh: new Map(), old: new Map() };
  const keyId = (p, k) => p.id + '|' + (k.n - 1);
  // Build a candidate queue for every configured API key. A model listed under several keys
  // is still tested only once per provider; the first eligible key is used as its representative.
  provs.forEach((p) => {
    p.keys.forEach((k) => {
      if (!k.ok) return;
      const id = keyId(p, k);
      const models = [...new Set([...modelsFor(p, k), ...(p.forced || [])])];
      models.forEach((m) => {
        const b = dbRec(p.id, m);
        if (b && (b.tier === 'paid' || b.cost === 'paid' || b.tier === 'limited')) return;
        const tested = !!(b && Number(b.ok || 0) + Number(b.fail || 0) > 0) || Object.keys(outs).some((r0) => r0.startsWith(p.id + ':' + m + '|'));
        if (!tested) {
          if (!candidates.fresh.has(id)) candidates.fresh.set(id, { p, k, models: [] });
          candidates.fresh.get(id).models.push({ m, pri: lane(p.id, m) });
          return;
        }
        // 10% health sample: only models with a proven prior success that are still classified Working.
        // A model already failing after student traffic is intentionally left for Manual Retest.
        if (b && Number(b.ok || 0) > 0 && modelBucket(p.id, m) === 'working') {
          if (!candidates.old.has(id)) candidates.old.set(id, { p, k, models: [] });
          candidates.old.get(id).models.push({ m, pri: 0, updated: Number(b.updated || 0) });
        }
      });
    });
  });
  const sortQueues = (map, old) => [...map.entries()].map(([id, q]) => {
    const unique = new Map(); q.models.forEach((x) => { if (!unique.has(x.m)) unique.set(x.m, x); });
    q.models = [...unique.values()].sort((a, b) => old
      ? (a.updated - b.updated) || (scoreSafe(b.m) - scoreSafe(a.m))
      : (a.pri - b.pri) || (scoreSafe(b.m) - scoreSafe(a.m)));
    q.id = id; q.at = 0;
    return q;
  });
  const freshQ = sortQueues(candidates.fresh, false), oldQ = sortQueues(candidates.old, true);
  const keyUsage = new Map(); // shared across 90/10 lanes: max 2 distinct provider:model tests per API key
  const take = (queues, limit, already, perKeyLimit = SMART_PER_KEY) => {
    const picked = [], seen = already || new Set();
    if (!queues.length) return picked;
    let progress = true, cursor = 0;
    try { cursor = Number(localStorage.getItem('ey_smart_key_cursor') || 0) % queues.length; } catch (_) {}
    while (picked.length < limit && progress) {
      progress = false;
      const roundStart = cursor; let nextCursor = cursor;
      for (let step = 0; step < queues.length; step++) {
        if (picked.length >= limit) break;
        const qi = (roundStart + step) % queues.length, q = queues[qi];
        if ((keyUsage.get(q.id) || 0) >= perKeyLimit) continue;
        while (q.at < q.models.length && seen.has(q.p.id + ':' + q.models[q.at].m)) q.at++;
        if (q.at >= q.models.length) continue;
        const x = q.models[q.at++], id = q.p.id + ':' + x.m;
        if (seen.has(id)) continue;
        seen.add(id); keyUsage.set(q.id, (keyUsage.get(q.id) || 0) + 1); picked.push({ p: q.p, k: q.k, m: x.m }); progress = true;
        nextCursor = (qi + 1) % queues.length;
      }
      cursor = nextCursor;
    }
    try { localStorage.setItem('ey_smart_key_cursor', String(cursor)); } catch (_) {}
    return picked;
  };
  const totalFresh = new Set(freshQ.flatMap((q) => q.models.map((x) => q.p.id + ':' + x.m))).size;
  const totalOld = new Set(oldQ.flatMap((q) => q.models.map((x) => q.p.id + ':' + x.m))).size;
  const freshTarget = Math.min(SMART_MAX, Math.round(SMART_MAX * 0.9)); // 10 => 9; 12 => 11
  const oldTarget = SMART_MAX - freshTarget; // 10 => 1; 12 => 1
  const used = new Set();
  let fresh = take(freshQ, freshTarget, used, 1);
  let old = take(oldQ, oldTarget, used, SMART_PER_KEY);
  // If one lane is short, use remaining slots from the other lane; never pull Never-worked or failed models.
  if (fresh.length < freshTarget && old.length < oldTarget) {
    old = old.concat(take(oldQ, SMART_MAX - fresh.length - old.length, used, SMART_PER_KEY));
  }
  if (fresh.length + old.length < SMART_MAX) {
    fresh = fresh.concat(take(freshQ, SMART_MAX - fresh.length - old.length, used, SMART_PER_KEY));
  }
  return {
    items: [...fresh, ...old],
    fresh: fresh.length,
    old: old.length,
    totalFresh,
    totalOld,
    total: totalFresh + totalOld,
  };
}
function scoreSafe(m) { try { return nameScore(m); } catch (_) { return 0; } }

function starItems() {
  const out = [];
  provs.forEach((p) => p.keys.forEach((k) => { modelsFor(p, k).forEach((m) => { if (isStar(p, m) && p.keys.find((kk) => kk.ok && modelsFor(p, kk).includes(m)) === k && !isDone(p.id, m) && !(bidx[p.id + ':' + m] && ['paid', 'dead', 'limited'].includes(bidx[p.id + ':' + m].tier))) out.push({ p, k, m }); }); }));
  return out;
}
function updateButtons() {
  const gw = cur === '@gw', n = starItems().length;
  $('co').disabled = busy || gw || !shown.length;
  $('co').textContent = 'Test selected (' + shown.length + ')';
  $('all').disabled = !busy && !n;
  $('all').textContent = busy ? '⏹ Stop' : 'Test all (' + n + ')';
  const sp = smartPlan(), sm = sp.items.length;
  $('smart').disabled = !busy && !sm;
  $('smart').textContent = busy ? '⏹ Stop' : sm ? 'Smart scan (' + sp.total + ')' : '✓ Scan complete';
  $('load').disabled = busy;
}

$('load').onclick = load;
$('gear').onclick = () => { const h = !$('conn').hidden; $('conn').hidden = h; $('gear').setAttribute('aria-expanded', String(!h)); };
$('co').onclick = () => runAll(shown.slice());
$('all').onclick = () => { if (busy) { stopReq = true; return; } runAll(starItems()); };
$('smart').onclick = () => { if (busy) { stopReq = true; return; } runAll(smartPlan().items); };
summary();
load();
</script>
