<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Model Tester</title>
<style>
:root{
  --bg:#f5f6f8;--surface:#fff;--surface2:#eef0f4;--line:#e1e4ea;--tx:#161a22;--mut:#6a7282;
  --acc:#3d4fe0;--acc-tx:#fff;--ok:#12805c;--ok-bg:#e3f5ee;--bad:#c42b3a;--bad-bg:#fdebed;--warn:#b26a00;
  --shadow:0 1px 2px rgba(20,26,40,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1218;--surface:#171b24;--surface2:#1f2430;--line:#283040;--tx:#e8ebf2;--mut:#8a93a6;
  --acc:#7b8cff;--acc-tx:#0d1020;--ok:#4fd1a1;--ok-bg:#12302a;--bad:#ff7b87;--bad-bg:#35181d;--warn:#f0b250;--shadow:none;
}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top,0px) 0 0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 190px}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0 14px}
h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
.iconbtn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;box-shadow:var(--shadow)}
.iconbtn:hover{background:var(--surface2)}
.iconbtn:disabled{opacity:.55;cursor:default}

/* connection panel */
.conn{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.conn[hidden]{display:none}
.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:6px}
.conn input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.conn .actions{display:flex;align-items:center;gap:12px;margin-top:10px}
.status{font-size:13px;color:var(--mut)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:16px}
.stat{padding:12px 14px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat b{display:block;font-size:22px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--mut)}
.stat.ok b{color:var(--ok)}.stat.bad b{color:var(--bad)}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 12px;color:var(--mut);font-weight:600;font-size:14.5px;white-space:nowrap}
.tab:hover{color:var(--tx)}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.tab i{font-style:normal;font-weight:600;font-size:12px;background:var(--surface2);color:var(--mut);border-radius:20px;padding:1px 8px;margin-left:6px}
.tab.on i{background:var(--acc);color:var(--acc-tx)}

/* company header + models */
.cohead{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px}
.cohead h2{margin:0;font-size:17px}
.cohead span{font-size:13px;color:var(--mut)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.m{padding:12px 14px;border-top:1px solid var(--line)}
.m:first-child{border-top:0}
.top{display:flex;align-items:center;gap:12px}
.dot{flex:0 0 auto;width:10px;height:10px;border-radius:50%;background:var(--mut);opacity:.45}
.m[data-s=ok] .dot{background:var(--ok);opacity:1}
.m[data-s=bad] .dot{background:var(--bad);opacity:1}
.m[data-s=skip] .dot{background:none;border:2px solid var(--warn);opacity:1}
.m[data-s=load] .dot{background:var(--warn);opacity:1;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.m[data-s=load] .dot{animation:none}}
.info{flex:1;min-width:0}
.name{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--mut)}
.ctl{display:flex;align-items:center;gap:8px}
.ctl select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px}
.send{background:var(--acc);color:var(--acc-tx);border:0;border-radius:9px;padding:7px 14px;font-weight:600;font-size:13.5px}
.send:disabled{opacity:.5;cursor:default}
.out{margin:10px 0 0 22px;border-radius:10px;border:1px solid var(--line);background:var(--bg);overflow:hidden}
.out[hidden]{display:none}
.oh{display:flex;justify-content:space-between;gap:8px;padding:6px 12px;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--line)}
.out.ok .oh{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.out.bad .oh{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.out.load .oh{color:var(--warn)}
.ob{padding:10px 12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:320px;overflow:auto}
.empty{padding:36px 16px;text-align:center;color:var(--mut)}

/* composer */
.composer{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.cin{max-width:760px;margin:0 auto}
.cin textarea{width:100%;resize:none;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;max-height:140px;font-size:15px}
.crow{display:flex;gap:8px;margin-top:8px}
.crow button{flex:1;border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px}
.crow .pri{background:var(--acc);color:var(--acc-tx);border:0}
.crow .sec{background:var(--surface2);border:1px solid var(--line)}
.crow button:disabled{opacity:.5;cursor:default}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
@media (max-width:480px){.stat{padding:10px}.stat b{font-size:19px}.out{margin-left:0}.top{flex-wrap:wrap}.ctl{margin-left:22px}}

/* v4: key chips, filters, gateway rows */
.conn input+.lbl{margin-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 2px 10px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;box-shadow:var(--shadow)}
.chip.on{border-color:var(--acc);color:var(--acc)}
.chip.bad{color:var(--bad)}
.kinfo{margin:0 2px 10px;font-size:13px;color:var(--mut)}
.kerr{margin:0 0 10px;border:1px solid var(--line);border-radius:10px;background:var(--bad-bg);color:var(--bad);padding:10px 12px;font-size:13.5px;overflow-wrap:anywhere;white-space:pre-wrap}
.filt{display:flex;gap:10px;align-items:center;margin:0 2px 10px}
.filt input[type=search]{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.filt label{font-size:13px;color:var(--mut);white-space:nowrap;display:flex;gap:6px;align-items:center}
.star{color:var(--warn);margin-left:6px;font-weight:700}
.tag{font-size:12px;font-weight:600;border-radius:20px;padding:2px 9px;background:var(--surface2);color:var(--mut);white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.bad{background:var(--bad-bg);color:var(--bad)}
.note{margin:0 2px 10px;font-size:12.5px;color:var(--warn)}
/* v5: per-company colour, key buttons, gateway cards */
.cohead{border-left:4px solid var(--c,var(--acc));padding-left:10px;gap:4px 12px;flex-wrap:wrap}
.cohead span{text-align:left}
.chip.on{border-color:var(--c,var(--acc))}
.send[data-s=ok]{background:var(--ok)}.send[data-s=bad]{background:var(--bad)}.send[data-s=load]{background:var(--warn)}
.send.kb{min-width:44px;padding:7px 10px}
.outs .out{margin-top:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:0 0 12px}
.card{text-align:left;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px}
.card.on{outline:2px solid var(--c)}
.card b{font-size:14px}.card span{font-size:12px;color:var(--mut)}
.kpills{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.kpills i{font-style:normal;font-size:11px;font-weight:600;border-radius:20px;padding:1px 7px;background:var(--ok-bg);color:var(--ok)}
.kpills i.bad{background:var(--bad-bg);color:var(--bad)}
.cob{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:8px;color:#fff;background:var(--c);vertical-align:1px}
.bar{height:4px;border-radius:4px;background:var(--surface2);margin:5px 0 3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}
.tag.warn{background:#fff3df;color:var(--warn)}
.m.paid{opacity:.55}
.gerr{font-size:12px;color:var(--bad);overflow-wrap:anywhere}
.chips.tiers .chip{padding:5px 10px;font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>AI Model Tester</h1>
      <div class="sub" id="msg">Load ho raha hai…</div>
    </div>
    <button class="iconbtn" id="gear" aria-expanded="false">⚙ Connection</button>
  </header>

  <section class="conn" id="conn" hidden>
    <label class="lbl" for="url">Val Town URL</label>
    <input id="url" placeholder="https://xxxx.web.val.run" autocomplete="off">
    <div class="actions">
      <button class="iconbtn" id="load">🔄 Reload</button>
      <span class="status" id="connNote"></span>
    </div>
  </section>

  <div class="stats" id="sum"></div>
  <nav class="tabs" id="tabs" aria-label="Companies"></nav>
  <div id="list"></div>
</div>

<div class="composer">
  <div class="cin">
    <label class="lbl" for="prompt" style="margin-bottom:6px">Message</label>
    <textarea id="prompt" rows="1">Hi</textarea>
    <div class="crow">
      <button class="pri" id="co" disabled>Test shown models</button>
      <button class="sec" id="all" disabled>Test all ★ models</button>
      <button class="sec" id="smart" disabled>🧠 Smart test</button>
    </div>
    <div class="hint">★ = gateway pool · K1/K2 = us key se test · 🧠 Smart test ek baar me max 12 models jaanchta hai: pehle naye, phir 2+ din purane (paid aur band chhod deta hai). Natije SQLite me save hote hain.</div>
  </div>
</div>

<script>
const DEFAULT_URL = 'https://vishalyadav--ac9af586d5c311f1ac7a1607ee4eb77e.web.val.run';
const $ = (id) => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

let provs = [];          // /admin/models : company -> keys -> models each key can see
let board = [];          // /status : gateway leaderboard (real traffic ratings)
let dbOn = null;
let gwCo = '', gwTier = '', keyState = {}, bidx = {};   // gateway tab filters + per-company key rest state
const res = {};          // rid -> 'ok' | 'bad'
const outs = {};         // rid -> {kind, head, text, right}
const refs = {};         // rid -> {row, out}  (only for rows currently on screen)
let cur = null;          // current tab: company id or '@gw'
const curKey = {};       // company id -> chosen key index
let q = '', starOnly = false, busy = false, stopReq = false, shown = [];

try { $('url').value = localStorage.getItem('ey_test_url') || DEFAULT_URL; }
catch (e) { $('url').value = DEFAULT_URL; }
const base = () => $('url').value.trim().replace(/\/+$/, '');
const rid = (p, k, m) => p.id + ':' + m + '|' + (k.n - 1);

/* ---------- data helpers ---------- */
function modelsFor(p, k) {
  const set = new Set(k.ok ? k.chat : []);
  p.forced.forEach((m) => set.add(m));
  const all = [...set];
  const pool = p.pool.filter((m) => set.has(m));
  const rest = all.filter((m) => !p.pool.includes(m)).sort();
  return [...pool, ...rest];
}
const isStar = (p, m) => p.pool.includes(m);
function unionCount(p) { const s = new Set(); p.keys.forEach((k) => modelsFor(p, k).forEach((m) => s.add(m))); return s.size; }

function summary() {
  let total = 0; provs.forEach((p) => p.keys.forEach((k) => { total += modelsFor(p, k).length; }));
  const ok = Object.values(res).filter((v) => v === 'ok').length;
  const bad = Object.values(res).filter((v) => v === 'bad').length;
  const box = $('sum'); box.innerHTML = '';
  [['Listed', total, ''], ['Working', ok, 'ok'], ['Failed', bad, 'bad'], ['Pending', Math.max(0, total - ok - bad), '']].forEach(([l, n, c]) => {
    const s = el('div', 'stat ' + c); s.appendChild(el('b', '', n)); s.appendChild(el('span', '', l)); box.appendChild(s);
  });
}

/* ---------- helpers ---------- */
const coColor = (id) => { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 360; return 'hsl(' + h + ' 62% 48%)'; };
const fmtRest = (s) => s < 90 ? s + 's' : s < 5400 ? Math.round(s / 60) + ' min' : s < 172800 ? (Math.round(s / 360) / 10) + ' ghante' : Math.round(s / 86400) + ' din';
function rowState(pid, m) {
  let st = 'idle';
  for (const r0 in outs) {
    if (!r0.startsWith(pid + ':' + m + '|')) continue;
    const kd = outs[r0].kind;
    if (kd === 'load') return 'load';
    if (kd === 'ok') st = 'ok'; else if (kd === 'bad' && st !== 'ok') st = 'bad';
  }
  return st;
}

/* ---------- output box under a row ---------- */
function paintOut(r0) {
  const f = refs[r0]; if (!f) return;
  const r = outs[r0];
  if (f.kb) f.kb.dataset.s = r ? r.kind : '';
  f.row.dataset.s = rowState(f.row.dataset.p, f.row.dataset.m);
  if (!r) { f.out.hidden = true; return; }
  f.out.hidden = false; f.out.className = 'out ' + r.kind; f.out.innerHTML = '';
  const h = el('div', 'oh'); h.appendChild(el('span', '', r.head)); if (r.right) h.appendChild(el('span', '', r.right));
  f.out.appendChild(h); f.out.appendChild(el('div', 'ob', r.text));
}
function setOut(r0, kind, head, text, right) { outs[r0] = { kind, head, text, right }; paintOut(r0); }

let rt = null;   // after tests the gateway ratings changed: quietly re-read /status
function softRefresh() {
  clearTimeout(rt);
  rt = setTimeout(async () => {
    try {
      const { j } = await getJson('/status');
      if (j && Array.isArray(j.leaderboard)) { board = j.leaderboard; dbOn = j.db; keyState = j.keyState || {}; if (cur === '@gw') render(); else updateButtons(); }
    } catch (e) {}
  }, 1500);
}

/* ---------- rendering ---------- */
function render() {
  bidx = {}; board.forEach((b) => { bidx[b.id] = b; });
  const tabs = $('tabs'); tabs.innerHTML = '';
  if (cur !== '@gw' && !provs.some((p) => p.id === cur)) cur = provs.length ? provs[0].id : (board.length ? '@gw' : null);
  provs.forEach((p) => {
    const t = el('button', 'tab' + (p.id === cur ? ' on' : ''), p.label);
    t.appendChild(el('i', '', unionCount(p)));
    t.onclick = () => { cur = p.id; render(); };
    tabs.appendChild(t);
  });
  if (board.length) {
    const t = el('button', 'tab' + (cur === '@gw' ? ' on' : ''), '📊 Gateway');
    t.appendChild(el('i', '', gwRows().length));
    t.onclick = () => { cur = '@gw'; render(); };
    tabs.appendChild(t);
  }
  for (const k in refs) delete refs[k];
  const box = $('list'); box.innerHTML = '';
  shown = [];
  if (!cur) {
    box.appendChild(el('div', 'empty', 'Koi company nahi mili. Val Town env me AI_<NAAM>_KEY aur AI_<NAAM>_ENDPOINT check karo.'));
  } else if (cur === '@gw') renderGateway(box);
  else renderCompany(box, provs.find((p) => p.id === cur));
  summary(); updateButtons();
}

function renderCompany(box, p) {
  let ki = curKey[p.id] ?? -1; if (ki >= p.keys.length) ki = -1; curKey[p.id] = ki;
  const sel = ki < 0 ? p.keys : [p.keys[ki]];
  const col = coColor(p.id);
  const bm = bidx;
  const head = el('div', 'cohead'); head.style.setProperty('--c', col); head.appendChild(el('h2', '', p.label));
  head.appendChild(el('span', '', [p.host, p.format, p.keys.length + ' key', p.auto ? 'auto discovery' : 'forced models'].filter(Boolean).join(' · ')));
  box.appendChild(head);

  const chips = el('div', 'chips'); chips.style.setProperty('--c', col);
  const mk = (txt, on, bad, fn) => { const c = el('button', 'chip' + (on ? ' on' : '') + (bad ? ' bad' : ''), txt); c.onclick = fn; chips.appendChild(c); };
  if (p.keys.length > 1) mk('Sab keys (' + p.keys.length + ')', ki < 0, false, () => { curKey[p.id] = -1; render(); });
  p.keys.forEach((kk, i) => mk('Key ' + kk.n + (kk.ok ? ' ✅ ' + kk.chat.length : ' ❌ ' + (kk.status || 'err')), p.keys.length === 1 || ki === i, !kk.ok, () => { curKey[p.id] = i; render(); }));
  box.appendChild(chips);

  sel.filter((k) => !k.ok).forEach((k) => box.appendChild(el('div', 'kerr', 'Key ' + k.n + ': model list nahi mili (HTTP ' + (k.status || 'network') + ', ' + k.ms + 'ms)\n' + (k.error || 'no details'))));
  if (sel.some((k) => !k.ok) && p.forced.length) box.appendChild(el('div', 'note', 'Forced models (AI_' + p.id + '_MODELS) neeche test ke liye diye hain.'));

  const sets = sel.map((k) => new Set(modelsFor(p, k)));
  const order = [...new Set(sel.flatMap((k) => modelsFor(p, k)))];
  const names = [...p.pool.filter((m) => order.includes(m)), ...order.filter((m) => !p.pool.includes(m)).sort()];
  box.appendChild(el('div', 'kinfo', names.length + ' models' + (sel.length > 1 ? ' (sab keys milakar, har model ke saamne K1/K2… alag test)' : '') + ' · ★ ' + p.pool.length + ' gateway pool me'));

  const filt = el('div', 'filt');
  const si = el('input'); si.type = 'search'; si.placeholder = 'Model dhundo…'; si.value = q; si.setAttribute('aria-label', 'Model dhundo');
  const lb = el('label'); const cb = el('input'); cb.type = 'checkbox'; cb.checked = starOnly; lb.appendChild(cb); lb.appendChild(document.createTextNode('Sirf ★'));
  filt.appendChild(si); filt.appendChild(lb); box.appendChild(filt);
  const listHost = el('div'); box.appendChild(listHost);
  const draw = () => {
    for (const r0 in refs) delete refs[r0];
    listHost.innerHTML = '';
    const ms = names.filter((m) => (!starOnly || isStar(p, m)) && (!q || m.toLowerCase().includes(q.toLowerCase())));
    shown = [];
    if (!ms.length) { listHost.appendChild(el('div', 'empty', 'Koi model nahi dikh raha.')); updateButtons(); return; }
    const list = el('div', 'list');
    ms.forEach((m) => {
      const ks = sel.filter((k, i) => sets[i].has(m));
      const d = el('div', 'm'); d.dataset.p = p.id; d.dataset.m = m; d.style.setProperty('--c', col);
      const top = el('div', 'top'); top.appendChild(el('span', 'dot'));
      const info = el('div', 'info'); const nm = el('div', 'name', m); if (isStar(p, m)) nm.appendChild(el('span', 'star', '★'));
      info.appendChild(nm);
      const b0 = bm[p.id + ':' + m]; const pd = !!(b0 && b0.tier === 'paid'); if (pd) d.classList.add('paid');
      info.appendChild(el('div', 'meta', 'Key ' + ks.map((k) => k.n).join(', ') + ' pe available · ' + (pd ? '💰 paid: gateway ise nahi aazmata' : b0 ? 'gateway: rating ' + b0.rating + (b0.avgSec != null ? ' · ' + b0.avgSec + 's' : '') + ' · ' + (b0.tier || '') : 'gateway pool ke bahar')));
      top.appendChild(info);
      const ctl = el('div', 'ctl'); const outs2 = el('div', 'outs');
      ks.forEach((k) => {
        const r0 = rid(p, k, m);
        const b = el('button', 'send kb', ks.length > 1 ? 'K' + k.n : 'Send'); b.title = 'Key ' + k.n + ' se test karo';
        b.onclick = () => testOne(p, k, m, b); ctl.appendChild(b);
        const out = el('div', 'out'); out.hidden = true; outs2.appendChild(out);
        refs[r0] = { row: d, out, kb: b }; if (!pd) shown.push({ p, k, m });
      });
      top.appendChild(ctl); d.appendChild(top); d.appendChild(outs2);
      list.appendChild(d);
    });
    listHost.appendChild(list);
    ms.forEach((m) => sel.forEach((k) => paintOut(rid(p, k, m))));
    updateButtons();
  };
  si.addEventListener('input', () => { q = si.value; draw(); });
  cb.addEventListener('change', () => { starOnly = cb.checked; draw(); });
  draw();
}

function gwRows() {
  const rows = board.map((b) => ({
    ...b,
    prov: b.provider || b.id.split(':')[0],
    mdl: b.model || b.id.slice(b.id.indexOf(':') + 1),
    tier: b.tier || (String(b.state).startsWith('resting') ? 'resting' : b.elite ? 'elite' : (b.ok + b.fail > 0 ? 'ok' : 'new')),
    rest: b.restSec != null ? b.restSec : (parseInt(String(b.state).replace(/\D/g, '')) || 0),
  }));
  const have = new Set(board.map((b) => b.id));
  provs.forEach((p) => {   // every other attached chat model: not in the gateway shortlist (yet)
    (p.ranked || [...new Set(p.keys.flatMap((k) => k.chat))]).forEach((m) => {
      if (!have.has(p.id + ':' + m)) rows.push({ id: p.id + ':' + m, prov: p.id, label: p.label, mdl: m, tier: 'out', rank: null, rating: null, ok: 0, fail: 0, avgSec: null, last: '-', lastErr: '', consec: 0, keys: p.keys.length, rest: 0, elite: false });
    });
  });
  return rows;
}
const TIERS = { elite: ['⭐ Elite', 'ok'], ok: ['✓ Theek', 'ok'], new: ['🆕 Naya', ''], slow: ['🐢 Slow', 'warn'], resting: ['⛔ Block', 'bad'], paid: ['💰 Paid', 'bad'], out: ['⚪ Pool ke bahar', ''] };
function renderGateway(box) {
  const rows = gwRows();
  const head = el('div', 'cohead'); head.appendChild(el('h2', '', 'Gateway leaderboard'));
  head.appendChild(el('span', '', 'asli requests + tester ki rating, best pehle')); box.appendChild(head);
  if (dbOn === false) box.appendChild(el('div', 'note', 'SQLite nahi mila: ratings sirf memory me hain (val restart pe reset).'));

  // one card per company: how many models work / are new / are blocked, avg speed, key rest state. Tap = filter.
  const co = {};
  rows.forEach((r) => {
    const c = co[r.prov] || (co[r.prov] = { label: r.label || r.prov, n: 0, live: 0, fresh: 0, rest: 0, out: 0, sec: [] });
    c.n++;
    if (r.tier === 'out') c.out++; else if (r.tier === 'resting' || r.tier === 'paid') c.rest++; else if (r.tier === 'new') c.fresh++; else c.live++;
    if (r.avgSec != null && r.tier !== 'resting') c.sec.push(r.avgSec);
  });
  const cards = el('div', 'cards');
  Object.keys(co).sort().forEach((id) => {
    const c = co[id]; const d = el('button', 'card' + (gwCo === id ? ' on' : '')); d.style.setProperty('--c', coColor(id));
    d.appendChild(el('b', '', c.label));
    d.appendChild(el('span', '', c.live + ' chal · ' + c.fresh + ' naye · ' + c.rest + ' block' + (c.out ? ' · ' + c.out + ' bahar' : '')));
    d.appendChild(el('span', '', c.sec.length ? '⚡ avg ' + (c.sec.reduce((a, b) => a + b, 0) / c.sec.length).toFixed(1) + 's' : 'speed abhi pata nahi'));
    const ks = keyState[id] || [];
    if (ks.length) { const kp = el('div', 'kpills'); ks.forEach((k) => kp.appendChild(el('i', k.restSec > 0 ? 'bad' : '', 'K' + k.n + (k.restSec > 0 ? ' ⏸ ' + fmtRest(k.restSec) : ' ✓')))); d.appendChild(kp); }
    d.onclick = () => { gwCo = gwCo === id ? '' : id; render(); };
    cards.appendChild(d);
  });
  box.appendChild(cards);

  const base = rows.filter((r) => !gwCo || r.prov === gwCo);
  const tc = el('div', 'chips tiers');
  [['', 'Sab'], ['elite', '⭐ Elite'], ['ok', '✓ Theek'], ['new', '🆕 Naye'], ['slow', '🐢 Slow'], ['resting', '⛔ Block'], ['paid', '💰 Paid'], ['out', '⚪ Bahar']].forEach(([k, l]) => {
    const n = k ? base.filter((r) => r.tier === k).length : base.length;
    const c = el('button', 'chip' + (gwTier === k ? ' on' : ''), l + ' ' + n); c.onclick = () => { gwTier = k; render(); }; tc.appendChild(c);
  });
  box.appendChild(tc);

  const list = el('div', 'list');
  const vis = base.filter((r) => !gwTier || r.tier === gwTier);
  if (!vis.length) list.appendChild(el('div', 'empty', 'Is filter me koi model nahi.'));
  vis.forEach((r) => {
    const d = el('div', 'm'); d.style.setProperty('--c', coColor(r.prov)); const top = el('div', 'top');
    d.dataset.s = (r.tier === 'resting' || r.tier === 'paid') ? 'bad' : (r.ok > 0 ? 'ok' : 'idle');
    top.appendChild(el('span', 'dot'));
    const info = el('div', 'info'); const nm = el('div', 'name', (r.rank ? r.rank + '. ' : '– ') + r.mdl);
    if (r.elite) nm.appendChild(el('span', 'star', '★'));
    nm.appendChild(el('span', 'cob', r.label || r.prov)); info.appendChild(nm);
    const bar = el('div', 'bar'); const f = el('i'); f.style.width = Math.max(2, Math.min(100, r.rating)) + '%'; bar.appendChild(f); if (r.rating != null) info.appendChild(bar);
    const sp = r.avgSec == null ? 'speed ?' : (r.avgSec <= 6 ? '⚡ ' : r.avgSec >= 20 ? '🐢 ' : '') + r.avgSec + 's';
    info.appendChild(el('div', 'meta', r.tier === 'out' ? 'Pool ke bahar: gateway abhi ise use nahi karta. Company tab me test karo, achha nikla to pool me aa jayega.' : 'rating ' + r.rating + ' · ok ' + r.ok + ' / fail ' + r.fail + ' · ' + sp + ' · last ' + r.last + ' · ' + r.keys + ' key' + (r.ok + r.fail ? '' : ' · abhi tak test nahi hua')));
    if (r.tier === 'paid') info.appendChild(el('div', 'gerr', '💰 Paid model: free plan pe nahi chalta, gateway ise kabhi nahi aazmata. Top-up ke baad tester me test karo, chal gaya to wapas aa jayega.')); else if (r.tier === 'resting') info.appendChild(el('div', 'gerr', '⛔ ' + fmtRest(r.rest) + ' tak band (lagatar ' + (r.consec || 1) + ' fail)' + (r.lastErr ? ' — ' + r.lastErr : '')));
    else if (r.lastErr && r.consec) info.appendChild(el('div', 'gerr', 'pichhli galti: ' + r.lastErr));
    top.appendChild(info);
    const t = TIERS[r.tier] || TIERS.ok; top.appendChild(el('span', 'tag ' + t[1], t[0]));
    d.appendChild(top); list.appendChild(d);
  });
  box.appendChild(list);
}

/* ---------- loading ---------- */
async function getJson(path) {
  const r = await fetch(base() + path);
  let j = null; try { j = await r.json(); } catch (e) {}
  return { status: r.status, j };
}
function showConn(note) { $('conn').hidden = false; $('gear').setAttribute('aria-expanded', 'true'); $('connNote').textContent = note || ''; }

async function load() {
  const u = base(); if (!u) return;
  try { localStorage.setItem('ey_test_url', u); } catch (e) {}
  $('msg').textContent = 'Load ho raha hai (har key ki model list mangi ja rahi hai)…'; $('load').disabled = true; $('connNote').textContent = '';
  const [rm, rs] = await Promise.allSettled([getJson('/admin/models'), getJson('/status')]);
  Object.keys(res).forEach((k) => delete res[k]); Object.keys(outs).forEach((k) => delete outs[k]);
  provs = []; board = []; dbOn = null; keyState = {};
  if (rs.status === 'fulfilled' && rs.value.j && Array.isArray(rs.value.j.leaderboard)) { board = rs.value.j.leaderboard; dbOn = rs.value.j.db; keyState = rs.value.j.keyState || {}; }
  let err = '';
  if (rm.status === 'rejected') err = '❌ Val se connect nahi hua: URL check karo (ya network / CORS).';
  else if (rm.value.status === 401 || rm.value.status === 403) err = '🔒 Ye page apni website ke origin se khula hona chahiye (jo Val Town env AI_ALLOWED_ORIGINS me hai). Is file ko wahi hosting par daalo, file se ya kisi aur site se nahi chalega.';
  else if (!rm.value.j || !Array.isArray(rm.value.j.providers)) err = '⚠️ Val me purana main.ts chal raha hai (/admin/models nahi mila). Latest main.ts deploy karo.';
  else provs = rm.value.j.providers;
  if (err) { $('msg').textContent = err; showConn(location.protocol === 'file:' ? 'Abhi page file:// se khula hai: hosting par upload karke kholo.' : ''); }
  else {
    const keys = provs.reduce((a, p) => a + p.keys.length, 0), good = provs.reduce((a, p) => a + p.keys.filter((k) => k.ok).length, 0);
    $('msg').textContent = provs.length ? provs.length + ' companies · ' + good + '/' + keys + ' keys ki list mili' : '⚠️ Koi company set nahi hai. Env vars check karo.';
  }
  $('load').disabled = false;
  render();
}

/* ---------- testing ---------- */
async function testOne(p, k, m, btn) {
  const r0 = rid(p, k, m), msgText = $('prompt').value.trim() || 'Hi';
  setOut(r0, 'load', 'Response aa raha hai…', '');
  if (btn) btn.disabled = true;
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 50000);
  try {
    const r = await fetch(base() + '/test', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ target: p.id + ':' + m, key: k.n - 1, prompt: msgText }), signal: ctl.signal });
    const j = await r.json();
    if (j.ok) { res[r0] = 'ok'; setOut(r0, 'ok', 'Working', j.text, (j.ms / 1000).toFixed(1) + 's · key ' + j.key + (j.recorded ? ' · 💾 saved' : '')); }
    else { res[r0] = 'bad'; setOut(r0, 'bad', 'Failed' + (j.status ? ' · HTTP ' + j.status : '') + ' · key ' + (j.key || k.n), j.error || 'unknown', j.ms ? (j.ms / 1000).toFixed(1) + 's' : ''); }
  } catch (e) {
    res[r0] = 'bad';
    setOut(r0, 'bad', 'Failed', e.name === 'AbortError' ? 'Timeout: 50s me response nahi aaya.' : e.message);
  }
  clearTimeout(tm);
  if (btn) btn.disabled = false;
  summary(); softRefresh();
}

async function runAll(items) {
  if (!items.length || busy) return;
  if (items.length > 25 && !confirm(items.length + ' tests chalenge (har ek chhota request). Chalu karu?')) return;
  busy = true; stopReq = false; updateButtons();
  const queue = items.slice(); let done = 0;
  const worker = async () => { while (queue.length && !stopReq) { const it = queue.shift(); await testOne(it.p, it.k, it.m, null); done++; $('msg').textContent = 'Test chal raha hai… ' + done + '/' + items.length; } };
  await Promise.all([worker(), worker(), worker()]);
  $('msg').textContent = stopReq ? 'Roka gaya: ' + done + '/' + items.length + ' test hue.' : 'Sab ' + items.length + ' tests ho gaye.';
  busy = false; stopReq = false; updateButtons();
}
// Smart test: only models that NEED a test, in small batches (max 12 per press, max 4 per company, so no free tier is hammered).
// Order: 1) never tested  2) tested but not for 2+ days, oldest first  3) only if 1+2 are empty: strongest-looking models outside the
// gateway shortlist (a proven one joins the shortlist). Paid and resting models are never included. One test per model.
const SMART_MAX = 12, PER_CO = 4, STALE_MS = 48 * 3600 * 1000;
function smartPlan() {
  const now = Date.now(), need = [];
  const triedHere = (pid, m) => Object.keys(outs).some((r0) => r0.startsWith(pid + ':' + m + '|'));
  board.forEach((b) => {
    const prov = b.provider || b.id.split(':')[0], mdl = b.model || b.id.slice(b.id.indexOf(':') + 1);
    if (b.tier === 'paid' || b.tier === 'resting') return;
    const tested = b.ok + b.fail > 0, age = tested ? now - (b.updated || 0) : Infinity;
    if (tested && age < STALE_MS) return;
    if (triedHere(prov, mdl)) return;
    need.push({ prov, mdl, pri: tested ? 1 : 0, age });
  });
  if (!need.length) provs.forEach((p) => (p.ranked || []).filter((m) => !bidx[p.id + ':' + m] && !triedHere(p.id, m)).slice(0, 6).forEach((m) => need.push({ prov: p.id, mdl: m, pri: 2, age: Infinity })));
  need.sort((a, b) => a.pri - b.pri || b.age - a.age);
  const per = {}, items = [];
  need.forEach((n) => {
    if (items.length >= SMART_MAX || (per[n.prov] || 0) >= PER_CO) return;
    const p = provs.find((x) => x.id === n.prov); if (!p) return;
    const ks = p.keys.filter((kk) => kk.ok && modelsFor(p, kk).includes(n.mdl));
    const k = ks.length ? ks[items.length % ks.length] : p.keys.find((kk) => kk.ok);
    if (!k) return;
    per[n.prov] = (per[n.prov] || 0) + 1; items.push({ p, k, m: n.mdl });
  });
  return { items, total: need.length };
}
function starItems() {
  const out = [];
  provs.forEach((p) => p.keys.forEach((k) => { modelsFor(p, k).forEach((m) => { if (isStar(p, m) && !(bidx[p.id + ':' + m] && bidx[p.id + ':' + m].tier === 'paid')) out.push({ p, k, m }); }); }));
  return out;
}
function updateButtons() {
  const gw = cur === '@gw', n = starItems().length;
  $('co').disabled = busy || gw || !shown.length;
  $('co').textContent = 'Test shown (' + shown.length + ')';
  $('all').disabled = !busy && !n;
  $('all').textContent = busy ? '⏹ Stop' : 'Test all ★ (' + n + ')';
  const sp = smartPlan(), sm = sp.items.length;
  $('smart').disabled = !busy && !sm;
  $('smart').textContent = busy ? '⏹ Stop' : sm ? '🧠 Smart test (' + sm + (sp.total > sm ? ' / ' + sp.total : '') + ')' : '🧠 Sab ho chuka';
  $('load').disabled = busy;
}

$('load').onclick = load;
$('gear').onclick = () => { const h = !$('conn').hidden; $('conn').hidden = h; $('gear').setAttribute('aria-expanded', String(!h)); };
$('co').onclick = () => runAll(shown.slice());
$('all').onclick = () => { if (busy) { stopReq = true; return; } runAll(starItems()); };
$('smart').onclick = () => { if (busy) { stopReq = true; return; } runAll(smartPlan().items); };
$('prompt').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !$('co').disabled) $('co').click(); });
$('prompt').addEventListener('input', function () { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 140) + 'px'; });
summary();
load();
</script>
