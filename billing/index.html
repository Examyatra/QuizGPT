<script>
// ===== Calculation (runs fully in the browser) =====
const r2 = (x) => Math.round((Number(x) + Number.EPSILON) * 100) / 100;

function calc(items, { mode = 'included', interstate = false, discount = 0, dtype = 'amt' } = {}) {
  const base = (items || []).map((it) => {
    const qty = Number(it.qty) || 0, rate = Number(it.rate) || 0;
    return { it, qty, rate, g: Number(it.gst) || 0, mode: it.gst_mode || mode, amt: r2(qty * rate) };
  });
  const sumAmt = r2(base.reduce((s, x) => s + x.amt, 0));
  const D = Math.min(Math.max(0, r2(dtype === 'pct' ? (sumAmt * Number(discount || 0)) / 100 : discount)), sumAmt); // discount cannot exceed bill
  let left = D, gross = 0, taxable = 0, tax = 0;
  const lines = base.map((x, i) => {
    const d = i === base.length - 1 ? left : r2(sumAmt ? (D * x.amt) / sumAmt : 0);
    left = r2(left - d);
    const net = r2(x.amt - d);
    const lineMode = x.mode === 'excluded' ? 'excluded' : 'included';
    const split = (v) => (lineMode === 'included' ? r2((v * 100) / (100 + x.g)) : v);
    const t0 = split(x.amt), tx = split(net);
    const t = lineMode === 'included' ? r2(net - tx) : r2((net * x.g) / 100);
    const cgst = interstate ? 0 : r2(t / 2);
    const sgst = interstate ? 0 : r2(t - cgst);
    const igst = interstate ? t : 0;
    gross = r2(gross + t0); taxable = r2(taxable + tx); tax = r2(tax + t);
    return { ...x.it, gst_mode: lineMode, qty: x.qty, rate: x.rate, gst: x.g, gst_set: x.it.gst !== '' && x.it.gst != null, amt: x.amt, disc: d, t0, taxable: tx, tax: t, cgst, sgst, igst };
  });
  const disc = r2(gross - taxable);           // discount shown on bill (taxable value)
  const sub = r2(taxable + tax);              // = gross - discount + tax
  const total = Math.round(sub);
  const roundoff = r2(total - sub);
  return { lines, gross, tax, discount: disc, sub, roundoff, total, words: words(total) };
}

const A = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve',
  'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
const T = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
function two(n) { return n < 20 ? A[n] : T[Math.floor(n / 10)] + (n % 10 ? ' ' + A[n % 10] : ''); }
function conv(n) {
  const parts = [];
  const cr = Math.floor(n / 1e7); n %= 1e7;
  const lk = Math.floor(n / 1e5); n %= 1e5;
  const th = Math.floor(n / 1e3); n %= 1e3;
  const h = Math.floor(n / 100); n %= 100;
  if (cr) parts.push(conv(cr) + ' Crore');
  if (lk) parts.push(two(lk) + ' Lakh');
  if (th) parts.push(two(th) + ' Thousand');
  if (h) parts.push(A[h] + ' Hundred');
  if (n) parts.push(two(n));
  return parts.join(' ');
}
function words(amount) {
  const v = r2(Math.abs(amount));
  const rs = Math.floor(v), p = Math.round((v - rs) * 100);
  let s = 'Rupees ' + (rs ? conv(rs) : 'Zero');
  if (p) s += ' and ' + conv(p) + ' Paise';
  return s + ' Only';
}

// iso 'YYYY-MM-DD' + whole years; clamps to last valid day (29 Feb -> 28 Feb)
function addYears(iso, years = 2) {
  const [y, m, d] = iso.split('-').map(Number);
  const ty = y + years;
  const last = new Date(ty, m, 0).getDate();
  const p = (n) => String(n).padStart(2, '0');
  return `${ty}-${p(m)}-${p(Math.min(d, last))}`;
}

// Auto expiry: random 2-3 years after bill date (kept per product via exp_off months)
const expRnd=()=>(Number(S&&S.expiry_years)||2)*12+Math.floor(Math.random()*13);
const addMon=(iso,m)=>{const[y,mo]=iso.split('-').map(Number);const t=y*12+(mo-1)+m;return Math.floor(t/12)+'-'+String(t%12+1).padStart(2,'0')};
const app=document.getElementById('app');
const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dmy=iso=>iso?iso.split('-').reverse().join('-'):'';
const rnd=()=>Math.random().toString(36).slice(2,6).toUpperCase();
const inr=n=>'₹ '+Number(n).toFixed(2).replace(/\.00$/,'');
const arr=x=>Array.isArray(x)?x:[];

// स्रोत: (1) फ़ोन से एक बार लाई गई .vcf फ़ाइल के संपर्क, (2) दुकान के पहले के ग्राहक।
const pbLoad=()=>{const a=lsGet('vms_pb');return Array.isArray(a)?a.filter(x=>x&&/^\d{10}$/.test(String(x.m))):[]};
function qpDec(t){try{const by=[];const x=String(t);for(let i=0;i<x.length;i++){if(x[i]==='='&&/^[0-9A-Fa-f]{2}$/.test(x.substr(i+1,2))){by.push(parseInt(x.substr(i+1,2),16));i+=2}else{const c=x.charCodeAt(i);if(c<128)by.push(c);else new TextEncoder().encode(x[i]).forEach(v=>by.push(v))}}return new TextDecoder('utf-8').decode(new Uint8Array(by))}catch(e){return String(t)}}
function parseVcf(txt){const out=[];const raw=String(txt||'').replace(/\r\n?/g,'\n').split('\n'),lines=[];
 for(let i=0;i<raw.length;i++){let l=raw[i];
  while(/QUOTED-PRINTABLE/i.test(l)&&/=\s*$/.test(l)&&i+1<raw.length){l=l.replace(/=\s*$/,'')+raw[++i]}
  if(/^[ \t]/.test(l)&&lines.length)lines[lines.length-1]+=l.slice(1);else lines.push(l)}
 let cur=null;
 for(const l of lines){const u=l.toUpperCase();
  if(u.startsWith('BEGIN:VCARD')){cur={n:'',fn:'',t:[]};continue}
  if(u.startsWith('END:VCARD')){if(cur){const nm=(cur.fn||cur.n||'').trim();cur.t.forEach(t=>{const m=tel10(t);if(/^\d{10}$/.test(m))out.push({n:nm,m})})}cur=null;continue}
  if(!cur)continue;const k=l.indexOf(':');if(k<0)continue;const head=l.slice(0,k),val=l.slice(k+1),key=head.split(';')[0].toUpperCase().replace(/^.*\./,'');
  const dv=/QUOTED-PRINTABLE/i.test(head)?qpDec(val):val;
  if(key==='FN')cur.fn=dv;else if(key==='N')cur.n=dv.split(';').map(x=>x.trim()).filter(Boolean).reverse().join(' ');else if(key==='TEL')cur.t.push(dv)}
 return out}

 try{const rg=await navigator.serviceWorker.getRegistration();if(rg)rg.update().catch(()=>{})}catch(e){}
 // सस्ता चेक: सिर्फ़ headers (HEAD). ?_= से CDN का पुराना cache भी बायपास होता है
 const hr=await fetch('index.html?_='+Date.now(),{method:'HEAD',cache:'no-store'});if(!hr.ok)return;
 const sig=[hr.headers.get('etag'),hr.headers.get('last-modified'),hr.headers.get('content-length')].join('|');
 if(sig==='||'||lsGet('vms_sig')===sig)return;
 const t=await(await fetch('index.html?_='+Date.now(),{cache:'no-store'})).text();
 const m=t.match(/const APP_VERSION='([^']+)'/);if(!m)return;
 const h=vmsHash(t),oh=lsGet('vms_h');
 const need=m[1]!==APP_VERSION||(oh!==undefined&&oh!==h);
 if(!need){lsSet('vms_sig',sig);lsSet('vms_h',h);return}
 // बिल भरते समय/टाइप करते समय नहीं; होम पर खाली होते ही अपडेट (अगली जाँच में)
 if(view!=='home'||MODALS.length||/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName))return;
 // रीलोड-लूप से बचाव: 2 मिनट में 3 से ज़्यादा auto-reload नहीं
 const now=Date.now(),L=(lsGet('vms_rls')||[]).filter(x=>now-x<120000);if(L.length>=3)return;L.push(now);lsSet('vms_rls',L);
 lsSet('vms_sig',sig);lsSet('vms_h',h);vmsFlush();
 location.replace('index.html?v='+h)}catch(e){}finally{vcBusy=false}}
try{newDraft();history.replaceState({v:'home'},'');show('home');if(window.__vmsUp)window.__vmsUp()}catch(e){console.error('VMS startup render error:',e);app.innerHTML='<h2>ऐप शुरू नहीं हो पाया</h2><p class=warn>'+esc(e&&e.message?e.message:'अज्ञात त्रुटि')+'</p><button class="btn main" onclick="location.reload()">🔄 दोबारा खोलें</button>';return}setTimeout(()=>{if(navigator.onLine!==false&&!(navigator.deviceMemory&&navigator.deviceMemory<=2))loadH2C()},2500);
setTimeout(()=>{autoCloudBackup()},3500);setTimeout(verChk,4500);setInterval(verChk,45000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')verChk()});window.addEventListener('online',verChk);window.addEventListener('focus',verChk)})();
</script></body></html>
