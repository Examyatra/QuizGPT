<script type="module">
// ===== Calculation (runs fully in the browser) =====
const r2 = (x) => Math.round((Number(x) + Number.EPSILON) * 100) / 100;

function calc(items, { mode = 'included', interstate = false, discount = 0 } = {}) {
  const base = (items || []).map((it) => {
    const qty = Number(it.qty) || 0, rate = Number(it.rate) || 0;
    return { it, qty, rate, g: Number(it.gst) || 0, amt: r2(qty * rate) };
  });
  const sumAmt = r2(base.reduce((s, x) => s + x.amt, 0));
  const D = Math.min(Math.max(0, r2(discount)), sumAmt); // discount cannot exceed bill
  let left = D, gross = 0, taxable = 0, tax = 0;
  const lines = base.map((x, i) => {
    const d = i === base.length - 1 ? left : r2(sumAmt ? (D * x.amt) / sumAmt : 0);
    left = r2(left - d);
    const net = r2(x.amt - d);
    const split = (v) => (mode === 'included' ? r2((v * 100) / (100 + x.g)) : v);
    const t0 = split(x.amt), tx = split(net);
    const t = mode === 'included' ? r2(net - tx) : r2((net * x.g) / 100);
    const cgst = interstate ? 0 : r2(t / 2);
    const sgst = interstate ? 0 : r2(t - cgst);
    const igst = interstate ? t : 0;
    gross = r2(gross + t0); taxable = r2(taxable + tx); tax = r2(tax + t);
    return { ...x.it, qty: x.qty, rate: x.rate, gst: x.g, gst_set: x.it.gst !== '' && x.it.gst != null, amt: x.amt, disc: d, taxable: tx, tax: t, cgst, sgst, igst };
  });
  const disc = r2(gross - taxable);           // discount shown on bill (taxable value)
  const sub = r2(taxable + tax);              // = gross - discount + tax
  const total = Math.round(sub);
  const roundoff = r2(total - sub);
  return { lines, gross, tax, discount: disc, sub, roundoff, total, words: words(total) };
}

const A = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve',
  'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
const T = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
function two(n) { return n < 20 ? A[n] : T[Math.floor(n / 10)] + (n % 10 ? ' ' + A[n % 10] : ''); }
function conv(n) {
  const parts = [];
  const cr = Math.floor(n / 1e7); n %= 1e7;
  const lk = Math.floor(n / 1e5); n %= 1e5;
  const th = Math.floor(n / 1e3); n %= 1e3;
  const h = Math.floor(n / 100); n %= 100;
  if (cr) parts.push(conv(cr) + ' Crore');
  if (lk) parts.push(two(lk) + ' Lakh');
  if (th) parts.push(two(th) + ' Thousand');
  if (h) parts.push(A[h] + ' Hundred');
  if (n) parts.push(two(n));
  return parts.join(' ');
}
function words(amount) {
  const v = r2(Math.abs(amount));
  const rs = Math.floor(v), p = Math.round((v - rs) * 100);
  let s = 'Rupees ' + (rs ? conv(rs) : 'Zero');
  if (p) s += ' and ' + conv(p) + ' Paise';
  return s + ' Only';
}

// iso 'YYYY-MM-DD' + whole years; clamps to last valid day (29 Feb -> 28 Feb)
function addYears(iso, years = 2) {
  const [y, m, d] = iso.split('-').map(Number);
  const ty = y + years;
  const last = new Date(ty, m, 0).getDate();
  const p = (n) => String(n).padStart(2, '0');
  return `${ty}-${p(m)}-${p(Math.min(d, last))}`;
}

// ===== Val Town backend link: paste here, OR leave as is and the app will ask once =====
const DEFAULT_API='https://ramkeshyadav--12bb1378d98e11f1a6291607ee4eb77e.web.val.run';
let API=(DEFAULT_API.startsWith('http')?DEFAULT_API:(localStorage.getItem('api_base')||'')).replace(/\/+$/,'');
const app=document.getElementById('app');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dmy=iso=>iso?iso.split('-').reverse().join('-'):'';
const rnd=()=>Math.random().toString(36).slice(2,6).toUpperCase();
const inr=n=>'₹ '+Number(n).toFixed(2).replace(/\.00$/,'');
async function api(p,o={}){const r=await fetch(API+'/api'+p,{...o,headers:{'content-type':'application/json'},body:o.body?JSON.stringify(o.body):undefined});
 const j=await r.json().catch(()=>({error:'सर्वर से जवाब नहीं आया'}));if(!r.ok)throw new Error(j.error||'Error');return j}
function modal(msg,btns){return new Promise(res=>{const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9';
 d.innerHTML=`<div style="background:#fff;border-radius:18px;padding:20px;max-width:440px;width:100%"><p style="font-size:23px;margin:0 0 10px;white-space:pre-line">${esc(msg)}</p>${btns.map((b,i)=>`<button class="btn ${b[1]}" data-i="${i}">${b[0]}</button>`).join('')}</div>`;
 d.onclick=e=>{const i=e.target.dataset.i;if(i!=null){d.remove();res(Number(i))}};document.body.appendChild(d)})}
const ask=m=>modal(m,[['हाँ','main'],['नहीं','']]).then(i=>i===0);
const say=m=>modal(m,[['ठीक है','main']]);
let S={},D=null,view='home',V=null,cache={cust:[],med:[]};
const blank=()=>({name:'',qty:1,mrp:'',rate:'',rt:false,open:false,hsn:'',pack:'',batch:'TMP-'+rnd(),batch_status:'temp',expiry:addYears(D?D.date:today(),Number(S.expiry_years)||2),expiry_status:'suggested',free:'',gst:'',mfr:'',save:true});
function newDraft(){D={client_key:crypto.randomUUID(),date:today(),customer:{name:'',mobile:'',address:'',gstin:'',dl:''},interstate:false,mode:S.gst_mode||'included',discount:'',items:[],saved:null};D.items=[blank()]}
const persist=()=>{try{if(D&&!D.saved)localStorage.setItem('draft',JSON.stringify(D))}catch(e){}};
function go(v){history.pushState({v},'');show(v)}
window.addEventListener('popstate',e=>show(e.state?e.state.v:'home'));
window.addEventListener('resize',()=>fit());
function show(v){view=v;({home,cust:custScr,prod:prodScr,prev:prevScr,set:setScr,old:oldScr})[v]();window.scrollTo(0,0)}
const back=()=>history.back();
const head=n=>`<div class=bar><button class=ghost onclick="back()">⬅ पीछे</button></div><div class=steps>${['ग्राहक','दवाइयाँ','बिल देखें'].map((t,i)=>`<span class="${i+1===n?'on':i+1<n?'done':''}">${i+1}. ${t}</span>`).join('')}</div>`;
function fit(){const w=document.getElementById('wrap'),i=document.getElementById('inv');if(!w||!i)return;const s=Math.min(1,(w.clientWidth-8)/760);i.style.transformOrigin='top left';i.style.transform=`scale(${s})`;w.style.height=(i.offsetHeight*s+8)+'px'}

// ---------- HOME ----------
function home(){app.innerHTML=`<h1>🏥 ${esc(S.shop_name)}</h1>
 <button class="btn main huge" onclick="newBill()">📝 नया बिल बनाएँ</button>
 <h3>🔍 पुराना बिल ढूँढें</h3><input id=q placeholder="बिल नंबर / नाम / मोबाइल लिखें" oninput="search()">
 <h3 id=ht>पिछले 6 महीने के बिल</h3><div id=list></div>
 <button class=ghost onclick="go('set')" style="margin-top:24px">⚙ सेटिंग (मालिक के लिए)</button>`;search()}
let st;function search(){clearTimeout(st);st=setTimeout(async()=>{const el=document.getElementById('q');if(!el)return;const t=el.value.trim();
 try{const r=await api('/invoices?q='+encodeURIComponent(t));document.getElementById('ht').textContent=t?'खोज के नतीजे':'पिछले 6 महीने के बिल';
 document.getElementById('list').innerHTML=r.map(i=>`<div class=item onclick="openInv(${i.id})"><b>बिल नं. ${esc(i.inv_no||i.serial)}</b> · ${dmy(i.date)}<br>${esc(i.cust_name||'नगद ग्राहक')} ${esc(i.cust_mobile)}<div style="text-align:right;font-size:24px"><b>${inr(i.total)}</b></div></div>`).join('')||'<p>कोई बिल नहीं मिला।</p>'}catch(e){document.getElementById('list').innerHTML='<p>'+esc(e.message)+'</p>'}},250)}
async function newBill(){let d=null;try{d=JSON.parse(localStorage.getItem('draft'))}catch(e){}
 if(d&&d.items&&(d.customer.name||d.items.some(i=>i.name))){const i=await modal('पिछला अधूरा बिल मिला है। क्या करें?',[['वही बिल जारी रखें','main'],['नया बिल शुरू करें','']]);if(i===0)D=d;else newDraft()}else newDraft();go('cust')}
async function openInv(id){try{V=await api('/invoices/'+id);go('old')}catch(e){say(e.message)}}

function custScr(){const c=D.customer;
 app.innerHTML=`${head(1)}<h2>ग्राहक का नाम</h2><input list=cn value="${esc(c.name)}" oninput="cs('name',this)" onchange="pick('name')" placeholder="नाम (न लिखें तो भी चलेगा)">
 <h2>मोबाइल नंबर</h2><input list=cm inputmode=numeric value="${esc(c.mobile)}" oninput="cs('mobile',this)" onchange="pick('mobile')" placeholder="मोबाइल (ज़रूरी नहीं)">
 <button class=btn onclick="tgm()">➕ और जानकारी (पता, GSTIN, लाइसेंस, तारीख)</button>
 <div id=more hidden><h2>पता</h2><input value="${esc(c.address)}" oninput="D.customer.address=this.value;persist()">
 <h2>GSTIN</h2><input id=gs value="${esc(c.gstin)}" oninput="gsin(this)" style="text-transform:uppercase">
 <h2>ग्राहक का ड्रग लाइसेंस नं.</h2><input value="${esc(c.dl)}" oninput="D.customer.dl=this.value;persist()">
 <h2>बिल की तारीख</h2><input type=date value="${D.date}" onchange="dchg(this.value)">
 <label><input type=checkbox id=ig style="width:26px;height:26px;margin-right:8px" ${D.interstate?'checked':''} onchange="D.interstate=this.checked;persist()">ग्राहक दूसरे राज्य का है (IGST लगेगा)</label></div>
 <button class="btn main huge" onclick="go('prod')">आगे बढ़ें ➡</button><p class=hint>नाम न हो तो भी आगे बढ़ सकते हैं।</p>`}
const tgm=()=>{const m=document.getElementById('more');m.hidden=!m.hidden};
function dchg(v){D.date=v;const y=Number(S.expiry_years)||2;D.items.forEach(it=>{if(it.expiry_status==='suggested')it.expiry=addYears(v,y)});persist()}
async function cs(f,el){D.customer[f]=el.value;persist();if(el.value.length<2)return;
 try{cache.cust=await api('/customers?q='+encodeURIComponent(el.value));
 document.getElementById('cn').innerHTML=cache.cust.map(x=>`<option value="${esc(x.name)}">${esc(x.mobile)}</option>`).join('');
 document.getElementById('cm').innerHTML=cache.cust.map(x=>`<option value="${esc(x.mobile)}">${esc(x.name)}</option>`).join('')}catch(e){}}
function pick(f){const v=D.customer[f];const m=cache.cust.find(x=>x[f]===v);if(!m)return;
 D.customer={name:m.name||'',mobile:m.mobile||'',address:m.address||'',gstin:m.gstin||'',dl:m.dl||''};gsin({value:D.customer.gstin});persist();custScr()}
function gsin(el){const g=el.value.toUpperCase().trim();D.customer.gstin=g;if(/^\d{2}/.test(g)){D.interstate=g.slice(0,2)!=='09';const b=document.getElementById('ig');if(b)b.checked=D.interstate}persist()}

function prodScr(){
 app.innerHTML=`${head(2)}<div id=rows></div><button class="btn good" onclick="addRow()">➕ दूसरी दवाई जोड़ें</button>
 <button class=btn onclick="tgo()">⚙ छूट / GST विकल्प</button>
 <div id=opt hidden><label>छूट (₹ में, कुल बिल पर)</label><input type=number inputmode=decimal value="${D.discount}" oninput="D.discount=this.value;upd();persist()">
 <label>GST कैसे जोड़ना है?</label><div class=seg><button id=m1 class="${D.mode==='included'?'on':''}" onclick="setMode('included')">GST रेट में शामिल है (सामान्य)</button><button id=m2 class="${D.mode==='excluded'?'on':''}" onclick="setMode('excluded')">GST ऊपर से जुड़ेगा</button></div></div>
 <div class=sticky><div><div class=tl><span>कुल रकम:</span><b id=tot>₹ 0</b></div><button class="btn main" onclick="toPrev()">आगे: बिल देखें ➡</button></div></div>`;rows();upd()}
const tgo=()=>{const m=document.getElementById('opt');m.hidden=!m.hidden};

function rows(){document.getElementById('rows').innerHTML=D.items.map((it,i)=>{
 const bs=it.batch_status==='temp'?'<span class=note>अस्थायी नंबर — कंपनी का बैच नंबर नहीं है (Temporary Reference — Not Manufacturer Batch Number)</span>':it.batch_status==='confirmed'?'<span class=ok>✔ आपने पक्का किया</span>':'';
 const es=it.expiry_status==='suggested'?'<span class=note>सुझाई गई तारीख — दवा के पैक से मिलाकर सही करें (Suggested Expiry — Verify from Actual Medicine Pack)</span>':it.expiry_status==='confirmed'?'<span class=ok>✔ पैक से पक्की की गई तारीख</span>':'';
 return `<div class=row><div class=rh><b>दवाई नं. ${i+1}</b>${D.items.length>1?`<button class=x onclick="rmc(${i})">🗑 हटाएँ</button>`:''}</div>
 <label>दवाई का नाम</label><input id=n${i} list=ms placeholder="जैसे: Paracetamol 500" value="${esc(it.name)}" oninput="pn(${i},this)" onchange="pf(${i},this.value)">
 <label>कितनी (संख्या)</label><div class=stp><button onclick="qs(${i},-1)">−</button><input id=q${i} type=number inputmode=decimal value="${it.qty}" oninput="sf(${i},'qty',this.value)"><button onclick="qs(${i},1)">+</button></div>
 <div class=two><div><label>MRP (पैकेट पर छपा भाव)</label><input type=number inputmode=decimal value="${it.mrp}" oninput="mr(${i},this.value)"></div>
 <div><label>आपका भाव (रेट)</label><input id=r${i} type=number inputmode=decimal value="${it.rate}" oninput="it_rt(${i},this.value)"></div></div>
 <div class=warn id=w${i}></div><div class=amtline>रकम: <b id=a${i}>₹ 0</b></div>
 <button class=btn onclick="tg(${i})">${it.open?'➖ जानकारी बंद करें':'➕ और जानकारी (बैच, एक्सपायरी, HSN…)'}</button>
 ${it.open?`<div class=adv><label>HSN कोड</label><input value="${esc(it.hsn)}" oninput="sf(${i},'hsn',this.value)">

function addRow(){D.items.push(blank());rows();upd();persist();const e=document.getElementById('n'+(D.items.length-1));if(e){e.focus();e.scrollIntoView({block:'center'})}}
async function rmc(i){if(await ask('यह दवाई हटानी है?')){D.items.splice(i,1);if(!D.items.length)D.items.push(blank());rows();upd();persist()}}
function qs(i,d){const it=D.items[i];it.qty=Math.max(1,(Number(it.qty)||0)+d);document.getElementById('q'+i).value=it.qty;upd();persist()}
function sf(i,k,v){D.items[i][k]=v;upd();persist()}
function mr(i,v){const it=D.items[i];it.mrp=v;if(!it.rt){it.rate=v;document.getElementById('r'+i).value=v}upd();persist()}
function it_rt(i,v){const it=D.items[i];it.rate=v;it.rt=true;upd();persist()}
function bt(i,v){const it=D.items[i];it.batch=v;it.batch_status=v.trim()?(/^TMP-/.test(v)?'temp':'confirmed'):'';persist()}
function ex(i,v){const it=D.items[i];it.expiry=v;it.expiry_status=v?'confirmed':'';persist()}
let mt;function pn(i,el){D.items[i].name=el.value;persist();clearTimeout(mt);if(el.value.length<2)return;
 mt=setTimeout(async()=>{try{cache.med=await api('/medicines?q='+encodeURIComponent(el.value));document.getElementById('ms').innerHTML=cache.med.map(m=>`<option value="${esc(m.name)}">MRP ${m.mrp??''}</option>`).join('')}catch(e){}},200)}
function pf(i,v){const m=cache.med.find(x=>x.name===v);if(!m)return;const it=D.items[i];
 it.mrp=m.mrp??'';it.rate=m.rate??'';it.rt=true;it.pack=m.pack||'';it.hsn=m.hsn||'';it.gst=m.gst??'';it.mfr=m.mfr||'';rows();upd();persist()}
function upd(){const r=calc(D.items,{mode:D.mode,interstate:D.interstate,discount:D.discount});
 r.lines.forEach((l,i)=>{const a=document.getElementById('a'+i);if(a)a.textContent=inr(l.amt);
  const t=document.getElementById('t'+i);if(t)t.textContent=`${l.cgst.toFixed(2)} / ${l.sgst.toFixed(2)} / ${l.igst.toFixed(2)}`;
  const w=document.getElementById('w'+i);if(w)w.textContent=(Number(l.mrp)>0&&l.rate>Number(l.mrp))?'⚠ रेट MRP से ज़्यादा है! MRP से ऊपर बेचना मना है।':''});
 const t=document.getElementById('tot');if(t)t.textContent=inr(r.total)}
function toPrev(){for(let i=0;i<D.items.length;i++){const it=D.items[i];const f=()=>{const e=document.getElementById('n'+i);if(e)e.scrollIntoView({block:'center'})};
 if(!it.name.trim()){f();return say(`दवाई नं. ${i+1} का नाम लिखें (या खाली दवाई हटा दें)।`)}
 if(!(Number(it.qty)>0)){f();return say(`"${it.name}" की संख्या लिखें।`)}
 if(it.rate===''||!(Number(it.rate)>=0)){f();return say(`"${it.name}" का भाव (रेट) लिखें।`)}}
 go('prev')}

// ---------- INVOICE HTML ----------
function invHTML(o){const sh=o.shop,c=o.customer,rows=o.lines.slice();while(rows.length<12)rows.push(null);
 const money=v=>{const n=Number(v).toFixed(2).split('.');return `<td class=rt>${n[0]}</td><td class=rt style="width:34px">${n[1]}</td>`};
 const extra=l=>{const p=[];if(l.pack)p.push(esc(l.pack));if(l.hsn)p.push('HSN '+esc(l.hsn));if(l.batch_status==='confirmed')p.push('Batch '+esc(l.batch));if(l.expiry_status==='confirmed'&&l.expiry)p.push('Exp '+dmy(l.expiry));if(l.gst_set&&l.gst)p.push('GST '+l.gst+'%');return p.length?`<div class=sm>${p.join(' · ')}</div>`:''};
 return `<div id=inv><div class=hd><table class=nb><tr><td style="width:36%"><b>D/L.No. ${esc(sh.dl1)}<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${esc(sh.dl2)}</b></td><td style="text-align:center"><u><b>Sale Invoice</b></u></td><td class=rt style="width:36%"><b>Mob. ${esc(sh.mobile)}</b></td></tr></table>
 <div><b>GSTIN.-${esc(sh.gstin)}</b></div>
 <div class=big-t>${sh.logo?`<img src="${sh.logo}" style="height:34px;vertical-align:middle;margin-right:8px">`:''}${esc(sh.shop_name)}</div><div style="text-align:center;font-size:16px"><b>${esc(sh.address)}${sh.pin?' - '+esc(sh.pin):''}</b></div></div>
 <table class=nb style="border-bottom:1.5px solid var(--ink)"><tr><td style="width:73%;padding:6px 10px">To,<br>&nbsp;&nbsp;<b>M/S ${esc(c.name)}</b>${c.mobile?' · '+esc(c.mobile):''}<br>${esc(c.address)}${c.gstin?'<br>GSTIN: '+esc(c.gstin):''}<br>D/L.No. ${esc(c.dl)}</td>
 <td style="vertical-align:top" class=rt>Date: <b>${dmy(o.date)}</b><div style="border:1.5px solid var(--ink);text-align:center;margin-top:8px;padding:4px">S.L. No.<div style="font-size:26px"><b>${esc(o.inv_no||o.serial)}</b></div></div></td></tr></table>
 <table><tr><th style="width:42%">DESCRIPTION</th><th>QUANTITY</th><th>MRP</th><th>RATE</th><th colspan=2>AMOUNT<br><span class=sm>Rs. &nbsp; P.</span></th></tr>
 ${rows.map(l=>l?`<tr><td>${esc(l.name)}${extra(l)}</td><td class=rt>${l.qty}${l.free?' + '+esc(l.free)+' free':''}</td><td class=rt>${l.mrp!=null&&l.mrp!==''?Number(l.mrp).toFixed(2):''}</td><td class=rt>${Number(l.rate).toFixed(2)}</td>${money(l.amt)}</tr>`:'<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td></tr>').join('')}</table>
 <table><tr><td rowspan=5 style="width:55%"><b>TOTAL IN WORDS</b><br>${esc(o.words)}<div class=sm style="margin-top:8px">${o.mode==='included'?'Prices GST included':'GST extra added'} · ${o.interstate?'IGST':'CGST+SGST'}</div>${o.lines.some(l=>!l.gst_set)?'<div class=sm>Kuch products ka GST rate set nahi (0% maana gaya)</div>':''}</td>
 <td><b>Gross Amount</b></td>${money(o.gross)}</tr><tr><td><b>TAX</b></td>${money(o.tax)}</tr><tr><td><b>Discount</b></td>${money(o.discount)}</tr><tr><td><b>Rounded off (+/-)</b></td><td class=rt colspan=2>${o.roundoff>0?'+':''}${Number(o.roundoff).toFixed(2)}</td></tr><tr><td><b>Total Amount</b></td>${money(o.total)}</tr></table>
 ${sh.terms?`<div class=sm style="padding:4px 8px">${esc(sh.terms)}</div>`:''}${sh.upi?`<div class=sm style="padding:2px 8px">UPI: ${esc(sh.upi)}${sh.pay_mobile?' · '+esc(sh.pay_mobile):''}</div>`:''}
 <table class=nb><tr><td style="padding:18px 10px 8px"><b>PARTY SIGNATURE</b></td><td class=rt style="padding:18px 10px 8px"><b>For: ${esc(sh.shop_name)}</b><br><br>${sh.show_signatory==='1'&&sh.signatory?'<span class=sm>'+esc(sh.signatory)+'<br>Authorised Signatory</span>':''}</td></tr></table></div>`}

// ---------- STEP 3 ----------
async function prevScr(){
 if(D.saved){app.innerHTML=actions(D.saved,true);fit();return}
 let nx={next:'',prefix:''};try{nx=await api('/next')}catch(e){}
 const r=calc(D.items,{mode:D.mode,interstate:D.interstate,discount:D.discount});
 const o={serial:nx.next,inv_no:nx.prefix+nx.next,date:D.date,customer:D.customer,shop:S,...r,mode:D.mode,interstate:D.interstate};
 app.innerHTML=`${head(3)}<div class=wrap id=wrap>${invHTML(o)}</div><p class=hint>बिल नंबर सेव करते ही पक्का होगा। एक बार देख लें, फिर सेव करें।</p>
 <button class="btn good huge" onclick="saveInv()">✅ बिल सेव करें</button><button class=btn onclick="back()">✏️ बदलाव करें</button>`;fit()}
const actions=(o,isNew)=>`<div class=bar><button class=ghost onclick="${isNew?'finish()':'back()'}">⬅ ${isNew?'होम':'पीछे'}</button></div>
 ${isNew?`<div class=item style="background:#e3f6ea;border-color:#12803a"><b style="font-size:24px">✔ बिल नं. ${esc(o.inv_no||o.serial)} सेव हो गया</b></div>`:''}
 <div class=wrap id=wrap>${invHTML(o)}</div>
 <button class="btn wa huge" onclick="doWa()">📲 WhatsApp पर भेजें</button><div class=two><button class=btn onclick="doPrint()">🖨 प्रिंट</button><button class=btn onclick="doPdf()">⬇ PDF</button></div>
 ${isNew?'<button class="btn main" onclick="finish()">➕ नया बिल बनाएँ</button>':''}`;
let saving=false;
async function saveInv(){if(saving)return;saving=true;try{const r=calc(D.items,{mode:D.mode,interstate:D.interstate,discount:D.discount});const b={client_key:D.client_key,date:D.date,customer:D.customer,mode:D.mode,interstate:D.interstate,lines:r.lines.map(({open,rt,...x})=>x),gross:r.gross,tax:r.tax,discount:r.discount,roundoff:r.roundoff,total:r.total,words:r.words};
 D.saved=await api('/invoices',{method:'POST',body:b});try{localStorage.removeItem('draft')}catch(e){}prevScr()}
 catch(e){say('❌ बिल सेव नहीं हुआ!\n'+e.message+'\nफिर से दबाएँ — दो बार नहीं बनेगा।')}finally{saving=false}}
function finish(){newDraft();history.pushState({v:'home'},'');show('home')}
const cur=()=>view==='old'?V:D.saved;
const doPrint=()=>window.print();
async function pdfBlob(){const el=document.getElementById('inv');const old=el.style.transform;el.style.transform='none';
 try{const cv=await html2canvas(el,{scale:2,backgroundColor:'#fff'});const {jsPDF}=window.jspdf;const pdf=new jsPDF('p','mm','a4');
 const W=200,H=cv.height*W/cv.width,max=287;let w=W,h=H;if(H>max){h=max;w=cv.width*max/cv.height}
 pdf.addImage(cv.toDataURL('image/jpeg',.95),'JPEG',5,5,w,h);return pdf.output('blob')}finally{el.style.transform=old}}
const fname=()=>'Invoice-'+(cur().inv_no||cur().serial)+'.pdf';
async function doPdf(){try{const b=await pdfBlob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fname();a.click()}catch(e){say('PDF नहीं बन पाया: '+e.message)}}
async function doWa(){try{const b=await pdfBlob();const f=new File([b],fname(),{type:'application/pdf'});
 const text=`Dear Customer, thank you for shopping with ${S.shop_name}. Please find your bill attached.`;
 if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text,title:fname()})}
 else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fname();a.click();await say('इस फ़ोन में सीधे PDF भेजना नहीं हो पाया। PDF डाउनलोड हो गया है — WhatsApp खोलकर उसे खुद जोड़कर भेजें।');window.open('https://wa.me/?text='+encodeURIComponent(text))}}
 catch(e){if(e.name!=='AbortError')say('भेजना नहीं हो पाया: '+e.message)}}
function oldScr(){app.innerHTML=actions(V,false);fit()}

// ---------- SETTINGS ----------
const F=[['shop_name','Shop Name'],['address','Address'],['pin','PIN Code'],['mobile','Mobile Number'],['gstin','GSTIN'],['dl1','Drug Licence No. 1'],['dl2','Drug Licence No. 2'],['signatory','Authorized Signatory'],['start_no','Starting S.L. No.'],['prefix','Invoice Prefix (optional)'],['transport','Default Transport'],['expiry_years','Suggested expiry (years)'],['upi','UPI ID'],['pay_mobile','Payment Mobile Number']];
async function setScr(){app.innerHTML=`<div class=bar><button class=ghost onclick="back()">⬅ पीछे</button><b>सेटिंग</b><span></span></div>
 ${F.map(([k,l])=>`<label>${l}</label><input id=s_${k} value="${esc(S[k])}">`).join('')}
 <label>Terms & Conditions</label><textarea id=s_terms rows=3>${esc(S.terms)}</textarea>
 <label>Default GST Mode</label><select id=s_gst_mode><option value=included ${S.gst_mode==='included'?'selected':''}>GST INCLUDED</option><option value=excluded ${S.gst_mode==='excluded'?'selected':''}>GST EXCLUDED</option></select>
 <label>Signatory naam bill par dikhayein</label><select id=s_show_signatory><option value=1 ${S.show_signatory==='1'?'selected':''}>Haan</option><option value=0 ${S.show_signatory!=='1'?'selected':''}>Nahi</option></select>
 <label>Medicine Autosave</label><select id=s_autosave><option value=1 ${S.autosave==='1'?'selected':''}>On</option><option value=0 ${S.autosave!=='1'?'selected':''}>Off</option></select>
 <label>Logo (max ~300KB)</label><input type=file accept="image/*" onchange="logo(this)"><button class=btn onclick="clrLogo()">Logo hatayein</button>
 <button class="btn main" onclick="saveSet()">SAVE SETTINGS</button>
 <h3>Data</h3><a class=btn href="${API}/api/backup" style="text-decoration:none;text-align:center">⬇ Backup</a><a class=btn href="${API}/api/export.csv" style="text-decoration:none;text-align:center">⬇ Export Invoice History (CSV)</a>
 <label>Restore (backup .json) — purana sab data replace hoga</label><input type=file accept=".json" onchange="restore(this)">
 <h3>Product Master</h3><input placeholder="Medicine search" oninput="medList(this.value)"><div id=ml></div>`;medList('')}
async function saveSet(){const b={};F.forEach(([k])=>b[k]=document.getElementById('s_'+k).value);['terms','gst_mode','show_signatory','autosave'].forEach(k=>b[k]=document.getElementById('s_'+k).value);
 try{S=await api('/settings',{method:'PUT',body:b});say('Settings save ho gayi')}catch(e){say('Save nahi hui: '+e.message)}}
function logo(el){const f=el.files[0];if(!f)return;if(f.size>300000)return say('Logo bahut bada hai');const r=new FileReader();r.onload=async()=>{try{S=await api('/settings',{method:'PUT',body:{logo:r.result}});say('Logo save hua')}catch(e){say(e.message)}};r.readAsDataURL(f)}
async function clrLogo(){S=await api('/settings',{method:'PUT',body:{logo:''}})}
async function restore(el){const f=el.files[0];if(!f||!await ask('सच में Restore करें? अभी का सारा डेटा बदल जाएगा।'))return;
 try{await api('/restore',{method:'POST',body:JSON.parse(await f.text())});S=await api('/settings');say('Restore ho gaya');setScr()}catch(e){say('Restore fail: '+e.message)}}
async function medList(t){const r=await api('/medicines?all=1&q='+encodeURIComponent(t||''));cache.ml=r;document.getElementById('ml').innerHTML=r.map(m=>`<div class=item><b>${esc(m.name)}</b>
 <div class=g4><input placeholder=MRP value="${m.mrp??''}" id=mm${m.id}><input placeholder=Rate value="${m.rate??''}" id=mr${m.id}><input placeholder=HSN value="${esc(m.hsn)}" id=mh${m.id}><input placeholder=GST% value="${m.gst??''}" id=mg${m.id}></div>
 <div class=two><button class=btn onclick="medSave(${m.id})">Save</button><button class="btn danger" onclick="medDel(${m.id})">Delete</button></div></div>`).join('')||'<p>Abhi koi medicine saved nahi.</p>'}
async function medSave(id){const g=k=>document.getElementById(k+id).value;const m=cache.ml.find(x=>x.id===id);
 try{await api('/medicines/'+id,{method:'PUT',body:{mrp:g('mm'),rate:g('mr'),hsn:g('mh'),gst:g('mg'),pack:m.pack,mfr:m.mfr}});say('Updated')}catch(e){say(e.message)}}
async function medDel(id){if(await ask('यह दवाई हटानी है?')){await api('/medicines/'+id,{method:'DELETE'});medList('')}}

Object.assign(window,{go,back,search,newBill,openInv,cs,pick,gsin,tgm,dchg,tgo,setMode,tg,addRow,rmc,qs,sf,mr,it_rt,bt,ex,pn,pf,toPrev,saveInv,finish,doPrint,doPdf,doWa,saveSet,logo,clrLogo,restore,medList,medSave,medDel,persist,upd});
Object.defineProperty(window,'D',{get:()=>D,set:v=>{D=v}});
function linkScr(msg){app.innerHTML=`<h1>🔗 सेटअप</h1>${msg?'<p class=warn>'+esc(msg)+'</p>':''}<h2>Val Town का लिंक यहाँ चिपकाएँ</h2><input id=lk placeholder="https://....val.run" value="${esc(API)}"><button class="btn main" onclick="saveLink()">सेव करें</button>`}
window.saveLink=()=>{const v=document.getElementById('lk').value.trim();if(!/^https:\/\//.test(v))return say('लिंक https:// से शुरू होना चाहिए');localStorage.setItem('api_base',v);location.reload()};
window.linkScr=linkScr;
if(!API){linkScr();throw new Error('no api')}
try{S=await api('/settings')}catch(e){linkScr('सर्वर से कनेक्ट नहीं हुआ ('+e.message+'). लिंक जाँचें।');throw e}
newDraft();history.replaceState({v:'home'},'');show('home');
</script></body></html>
